name: Publish Continuum guest demo into archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out archive site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out Continuum
        uses: actions/checkout@v4
        with:
          repository: GauriT7/Continuum
          ref: main
          path: continuum-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: continuum-source/package.json

      - name: Build guest demo
        working-directory: continuum-source
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish under /continuum/
        run: |
          mkdir -p continuum
          cp -R continuum-source/dist/. continuum/
          touch continuum/.nojekyll

      - name: Commit updated demo files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add continuum
          if git diff --cached --quiet; then
            echo "No demo changes to publish."
          else
            git commit -m "Publish Continuum guest demo"
            git push origin HEAD:main
          fi
