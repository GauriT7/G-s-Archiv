<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>about — archive.gauri</title>

  <!-- Curvy editorial font for floating words -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --cream: #f8f4e9;
      --burgundy: #a0002b;
      --dark-burgundy: #69001d;
      --text: #39272b;
      --muted: #88777a;
      --border: #e1d8cb;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: var(--cream);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }



    /* =========================================
       HEADER
    ========================================= */

    header {
      position: relative;
      z-index: 20;

      min-height: 120px;
      padding: 20px 6%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 8px;

      text-align: center;

      border-bottom: 1px solid var(--border);
    }

    .brand {
      color: var(--burgundy);
      font-size: 20px;
      font-weight: bold;
    }

    .tagline {
      margin: 0;

      color: var(--muted);

      font-size: 18px;
      font-style: italic;
      line-height: 1.4;
    }

    .home-link {
      position: absolute;
      left: 6%;
      top: 50%;

      transform: translateY(-50%);

      color: var(--muted);

      font-size: 14px;
      letter-spacing: 0.08em;

      transition:
        color 200ms ease,
        opacity 200ms ease;
    }

    .home-link:hover {
      color: var(--burgundy);
    }



    /* =========================================
       ABOUT PAGE
    ========================================= */

    .about-page {
      position: relative;

      min-height: calc(100vh - 120px);
      min-height: calc(100svh - 120px);

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 70px 7% 80px;
    }



    /* Keep real content above floating animation */

    .about-content {
      position: relative;
      z-index: 10;

      width: min(100%, 1160px);

      display: grid;
      grid-template-columns: 1.05fr 0.85fr;

      align-items: center;

      gap: 0;

    }



    /* =========================================
       HANDWRITTEN BIO
    ========================================= */

    .bio-wrap {
      display: flex;
      justify-content: center;
      align-items: center;

      transform: translateX(25px);
    }

    .bio-image {
      display: block;

      width: min(100%, 630px);
      max-height: 700px;

      object-fit: contain;

      opacity: 0;

      transform: translateY(12px);

      animation:
        content-arrive 1000ms 1300ms ease forwards;
    }



    /* =========================================
       PHOTO
    ========================================= */

    .photo-wrap {
      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;

      opacity: 0;

      transform: translateX(-58px);

      animation:
        content-arrive 1000ms 1450ms ease forwards;
    }

    .photo {
      display: block;

      width: min(100%, 420px);
      max-height: 570px;

      object-fit: cover;

      border-radius: 55px;

      box-shadow:
        0 14px 40px rgba(60, 30, 35, 0.08);
    }



    /* Tiny imperfect caption */

    .photo-caption {
      position: absolute;

      left: 8%;
      bottom: -30px;

      color: var(--muted);

      font-family: "Cormorant Garamond", serif;

      font-size: 14px;
      font-style: italic;

      opacity: 0.8;
    }



    @keyframes content-arrive {

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }



    /* =========================================
       FALLING SEEDS / FLOATING WORDS
    ========================================= */

    .whimsy-layer {
      position: absolute;
      inset: 0;

      z-index: 5;

      pointer-events: none;
      overflow: hidden;
    }



    /*
      Each item contains:

      1. seed image
      2. corresponding word

      JavaScript randomly chooses:
      - x position
      - y position
      - rotation
      - animation delay
      - opacity
    */

    .morph-item {
  position: absolute;
  left: var(--x);
  top: var(--y);

  width: max-content;
  height: max-content;

  opacity: 1;

  transform:
    translate(-50%, -50%)
    rotate(var(--rotation));

  pointer-events: none;

  z-index: 3;
}



    /* Seed starts visible */

    .morph-seed {
  display: block;

  width: var(--seed-size);
  height: var(--seed-size);

  object-fit: contain;

  opacity: 0;

  transform:
    translateY(-100vh)
    rotate(var(--seed-rotation));

  animation:
    seed-fall 3200ms
    var(--delay)
    cubic-bezier(.16, .8, .3, 1)
    forwards,

    seed-vanish 1800ms
    calc(var(--delay) + 4200ms)
    ease-in-out
    forwards;
}



    /* Word begins hidden */

    .morph-word {
  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  white-space: nowrap;

  color: var(--burgundy);

  font-family:
    "Cormorant Garamond",
    Georgia,
    serif;

  font-size:
    clamp(19px, 2vw, 31px);

  font-weight: 600;
  font-style: italic;

  opacity: 0;

  animation:
    word-appear 1400ms
    calc(var(--delay) + 3450ms)
    ease forwards,

    word-float var(--float-time)
    calc(var(--delay) + 4800ms)
    ease-in-out infinite alternate,

    word-breathe var(--breathe-time)
    calc(var(--delay) + 4500ms)
    ease-in-out infinite alternate;
}
    
    .word-changing {
  animation:
    word-change-out 1000ms ease-in-out forwards;
}

@keyframes word-change-out {

  0% {
    opacity: var(--base-opacity);
    filter: blur(0);
  }

  45% {
    opacity: 0.35;
    filter: blur(2px);
  }

  75% {
    opacity: 0;
    filter: blur(5px);
  }

  100% {
    opacity: 0;
    filter: blur(5px);
  }

}

    

    /*
      Seed falls from above screen
      into final random position- removed
    */

    @keyframes seed-fall {

  0% {
    opacity: 0;

    transform:
      translateY(-100vh)
      rotate(-18deg);
  }

  25% {
    opacity: 1;
  }

  72% {
    transform:
      translateY(18px)
      rotate(calc(var(--seed-rotation) + 4deg));
  }

  86% {
    transform:
      translateY(-5px)
      rotate(calc(var(--seed-rotation) - 2deg));
  }

  94% {
    transform:
      translateY(2px)
      rotate(var(--seed-rotation));
  }

  100% {
    opacity: 1;

    transform:
      translateY(0)
      rotate(var(--seed-rotation));
  }
}


@keyframes seed-vanish {

  0% {
    opacity: 1;

    transform:
      translateY(0)
      rotate(var(--seed-rotation))
      scale(1);
  }

  60% {
    opacity: 0.7;

    transform:
      translateY(0)
      rotate(var(--seed-rotation))
      scale(0.92);
  }

  100% {
    opacity: 0;

    transform:
      translateY(0)
      rotate(var(--seed-rotation))
      scale(0.72);
  }
}


    @keyframes word-appear {

      from {
        opacity: 0;
        filter: blur(4px);
      }

      to {
        opacity: var(--base-opacity);
        filter: blur(0);
      }

    }



    /*
      Words gently drift
    */

    @keyframes word-float {

      0% {
        transform:
          translate(-50%, -50%)
          translate(0, 0)
          rotate(-1deg);
      }

      50% {
        transform:
          translate(-50%, -50%)
          translate(4px, -5px)
          rotate(0.5deg);
      }

      100% {
        transform:
          translate(-50%, -50%)
          translate(-3px, 4px)
          rotate(-0.5deg);
      }

    }



    /*
      This creates the depth:
      one word fades down while another
      becomes stronger, continuously.
    */

    @keyframes word-breathe {

      0% {
        opacity: calc(var(--base-opacity) * 0.72);
      }

      50% {
        opacity: var(--base-opacity);
      }

      100% {
        opacity: calc(var(--base-opacity) * 0.82);
      }

    }



    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

  header {
    min-height: 88px;
    padding: 14px 18px;
  }

  .brand {
    font-size: 17px;
  }

  .tagline {
    font-size: 14px;
  }

  .home-link {
    left: 16px;
    font-size: 11px;
  }

  .about-page {
    padding: 28px 14px 55px;
    overflow: hidden;
  }

  .about-content {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;

    align-items: center;
    justify-content: flex-start;
  }

  .bio-wrap {
    order: 1;
    width: 100%;
    display: flex;
    transform: none;
    justify-content: center;
  }

  .bio-image {
    width: 86vw;
    max-height: 430px;
    height: auto;
    opacity: 0;
    transform: translateY(10px);
    animation:
      content-arrive 900ms 900ms ease forwards;
  }

  .photo-wrap {
    order: 2;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    
    transform: none;
    justify-content: center;
    opacity: 0;
    animation:
      content-arrive 900ms 1100ms ease forwards;
  }

  .photo {
    width: 78vw;
    max-width: 360px;
    height: 440px;
    
    aspect-ratio: 4 / 5;
    object-fit: cover;
    border-radius: 38px;
  }

  .photo-caption {
    position: static;

    width: 78px;
    max-width: 360px;

    margin-top: 9px;

    font-size: 12px;

    text-align: left;
  }

  .whimsy-layer {
    overflow: hidden;
  }

  .morph-word {
    font-size: 18px;
  }

  .morph-item {
    max-width: 90px;
  }

  .morph-seed {
    width: var(--seed-size);
    height: var(--seed-size);
  }

}



    /* =========================================
       ACCESSIBILITY
    ========================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

    }

  </style>

</head>


<body>

  <header>

    <a
      class="home-link"
      href="./index.html"
    >
      ← archive
    </a>

    <div class="brand">
      archive.gauri
    </div>

    <p class="tagline">
      collection of things I’ve made, found and thought about
    </p>

  </header>



  <main class="about-page">

    <!--
      Seeds + words are automatically
      generated here using JavaScript.
    -->

    <div
      class="whimsy-layer"
      id="whimsy-layer"
      aria-hidden="true"
    ></div>



    <!-- MAIN CONTENT -->

    <section class="about-content">

      <!-- LEFT: your handwritten Procreate bio -->

      <div class="bio-wrap">

        <img
          class="bio-image"
          src="./images/Bio.png"
          alt="A handwritten introduction by Gauri"
        >

      </div>



      <!-- RIGHT: your photo -->

      <div class="photo-wrap">

        <img
          class="photo"
          src="./images/Photo.jpg"
          alt="Portrait of Gauri"
        >

        <span class="photo-caption">
          a work in progress
        </span>

      </div>

    </section>

  </main>



  <script>

    /*
      WORDS

      Edit this whenever you want.
    */

    const words = [

  "art",
  "history",
  "fashion",
  "creativedirection",
  "medicine",
  "psychology",
  "economics",
  "tech",
  "AI",
  "longevity",
  "mixmedia",
  "culture",
  "languages",
  "food",

];



    /*
      YOUR EXISTING SIX SEEDS
    */

    const seedImages = [

      "./images/seed1.png",
      "./images/seed2.png",
      "./images/seed3.png",
      "./images/seed4.png",
      "./images/seed5.png",
      "./images/seed6.png"

    ];



    const layer =
      document.getElementById("whimsy-layer");



    /*
      Areas roughly occupied by the main
      photo + bio.

      We try not to place too many words
      right over the centre.
    */

    function createMorphItem(word, index) {

      const item =
        document.createElement("div");

      item.className =
        "morph-item";



      /*
  SAFE PERIMETER POSITIONS

  Words live around the bio + photo,
  never underneath them.
*/

const width = window.innerWidth;
const height = window.innerHeight;

let safeZones;

if (width <= 600 && height > width) {

  // PHONE PORTRAIT

  safeZones = [

    { x: 6,  y: 10 },
    { x: 94, y: 11 },

    { x: 5,  y: 30 },
    { x: 95, y: 32 },

    { x: 5,  y: 72 },
    { x: 95, y: 74 },

    { x: 8,  y: 91 },
    { x: 92, y: 91 }

  ];


} else if (width <= 900) {

  // MOBILE LANDSCAPE / TABLET

  safeZones = [

    { x: 6,  y: 14 },
    { x: 28, y: 9 },
    { x: 52, y: 10 },
    { x: 76, y: 9 },
    { x: 95, y: 15 },

    { x: 5,  y: 48 },
    { x: 95, y: 48 },

    { x: 8,  y: 86 },
    { x: 32, y: 91 },
    { x: 58, y: 90 },
    { x: 86, y: 86 }

  ];

} else {

  // DESKTOP

  safeZones = [

    { x: 5,  y: 24 },
    { x: 5,  y: 52 },
    { x: 5,  y: 80 },

    { x: 25, y: 10 },
    { x: 50, y: 9 },
    { x: 74, y: 10 },

    { x: 96, y: 28 },
    { x: 96, y: 53 },
    { x: 95, y: 80 },

    { x: 25, y: 92 },
    { x: 50, y: 93 },
    { x: 73, y: 92 },

    { x: 8,  y: 38 },
    { x: 91, y: 38 }

  ];

}

const position =
  safeZones[index % safeZones.length];


/*
  Add a little randomness so they don't
  look mathematically positioned.
*/

const x =
  position.x + random(-1.5, 1.5);

const y =
  position.y + random(-1.5, 1.5);


      const rotation =
        random(-8, 8);

      const seedRotation =
        random(-40, 40);

      const delay =
        random(100, 1300);

      const opacity =
        random(0.30, 0.70);

      const size =
        width <= 600
        ? random(16, 28)
        : width <= 760
        ? random(22, 38)
        : random(35, 65);

      const floatTime =
        random(6500, 10500);

      const breatheTime =
        random(3500, 7000);



      item.style.setProperty(
        "--x",
        `${x}%`
      );

      item.style.setProperty(
        "--y",
        `${y}%`
      );

      item.style.setProperty(
        "--rotation",
        `${rotation}deg`
      );

      item.style.setProperty(
        "--seed-rotation",
        `${seedRotation}deg`
      );

      item.style.setProperty(
        "--delay",
        `${delay}ms`
      );

      item.style.setProperty(
        "--base-opacity",
        opacity.toFixed(2)
      );

      item.style.setProperty(
        "--seed-size",
        `${size}px`
      );

      item.style.setProperty(
        "--float-time",
        `${floatTime}ms`
      );

      item.style.setProperty(
        "--breathe-time",
        `${breatheTime}ms`
      );



      /*
        SEED
      */

      const seed =
        document.createElement("img");

      seed.className =
        "morph-seed";

      seed.src =
        seedImages[
          index % seedImages.length
        ];

      seed.alt = "";



      /*
        WORD
      */

      const text =
        document.createElement("span");

      text.className =
        "morph-word";

      text.textContent = word;
      let currentWord = word;

function changeWord() {

  let nextWord;

  do {
    nextWord =
      words[
        Math.floor(
          Math.random() * words.length
        )
      ];
  }

  while (nextWord === currentWord);

  text.classList.add("word-changing");

  setTimeout(() => {

    currentWord = nextWord;
    text.textContent = currentWord;

    text.classList.remove("word-changing");

    setTimeout(
      changeWord,
      random(7000, 12000)
    );

  }, 700);

}

setTimeout(
  changeWord,
  random(7000, 12000)
);



      item.appendChild(seed);

      item.appendChild(text);

      layer.appendChild(item);

    }



    /*
      Utility:
      number between min/max
    */

    function random(min, max) {

      return Math.random()
        * (max - min)
        + min;

    }



    /*
      Shuffle slightly so the arrangement
      isn't identical every time.
    */

    const shuffledWords =
      [...words]
      .sort(() =>
        Math.random() - 0.5
      );



    shuffledWords.forEach(
      createMorphItem
    );

  </script>


</body>

</html>
