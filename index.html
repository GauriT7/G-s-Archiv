
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Gauri Archive">
<title>The Gauri Archive</title>

<style>
:root {
  --burgundy: #9e0124;
  --deep-burgundy: #6f0b24;
  --ivory: #faf5eb;
  --paper: #fffaf2;
  --ink: #30221f;
  --muted: #836f68;
  --line: #dfd1c4;
  --blush: #f8ebdd;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  background: var(--ivory);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
}

button {
  font: inherit;
}

button:focus-visible {
  outline: 2px solid var(--burgundy);
  outline-offset: 6px;
}

/* Custom cursor */

@media (hover: hover) and (pointer: fine) {
  body,
  button,
  a {
    cursor: url("./images/seed1.png") 16 16, auto;
  }
}

/* Header */

.site-header {
  padding: 22px clamp(22px, 6vw, 92px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
}

.site-header strong {
  color: var(--burgundy);
  font-size: 1.02rem;
}

/* Main pomegranate scene */

.hero {
  min-height: calc(100vh - 73px);
  display: grid;
  place-items: center;
  padding: 8px 20px 40px;
}

.scene {
  position: relative;
  width: min(100%, 1100px);
  height: min(900px, calc(100vh - 90px));
  min-height: 620px;
  display: grid;
  place-items: center;
  isolation: isolate;
}

/* Whole pomegranate */

.whole-fruit,
.cross-section {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 88%;
  max-width: 760px;
  transform: translate(-50%, -50%);
}

.whole-fruit {
  z-index: 2;
  border: 0;
  background: transparent;
  padding: 0;
  transition:
    opacity 700ms ease,
    transform 1100ms cubic-bezier(.22, 1, .36, 1);
}

.whole-fruit img,
.cross-section img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}

.whole-fruit img {
  transform-origin: 50% 12%;
  animation: fruitSway 5s ease-in-out infinite;
}

@keyframes fruitSway {
  0%, 100% {
    transform: rotate(-2deg) translateY(0);
  }

  50% {
    transform: rotate(2deg) translateY(-5px);
  }
}

/* Cross-section */

.cross-section {
  z-index: 1;
  width: 82%;
  max-width: 700px;
  opacity: 0;
  visibility: hidden;
  transform: translate(-50%, -50%) scale(.45) rotate(-8deg);
  transition:
    opacity 900ms ease,
    transform 1300ms cubic-bezier(.22, 1, .36, 1),
    visibility 0s linear 1300ms;
  pointer-events: none;
}

/* Seeds */

.orbit {
  position: absolute;
  inset: 0;
  z-index: 3;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 500ms ease;
}

.seed {
  position: absolute;
  left: 50%;
  top: 50%;

  width: clamp(40px, 7%, 70px);
  aspect-ratio: 1;

  border: 0;
  background: transparent;
  padding: 0;

  opacity: 0;
  pointer-events: none;

  transform:
    translate(-50%, -50%)
    rotate(var(--angle))
    translateY(0)
    rotate(calc(var(--angle) * -1))
    scale(.4);

  transition:
    transform 1200ms cubic-bezier(.22, 1, .36, 1),
    opacity 700ms ease;
}

.seed img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.seed:hover img {
  transform: scale(1.12) rotate(-5deg);
}

.seed img {
  transition: transform 300ms ease;
}

/* Open state */

.scene.open .whole-fruit {
  opacity: 0;
  transform: translate(-50%, -50%) scale(.45) rotate(12deg);
  pointer-events: none;
}

.scene.open .cross-section {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, -50%) scale(1) rotate(0);
  transition-delay: 0s;
}

.scene.open .orbit {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

/* Burst positions are calculated in JavaScript */

.scene.open .seed {
  opacity: 1;
  pointer-events: auto;
  transform:
    translate(-50%, -50%)
    rotate(var(--angle))
    translateY(calc(var(--radius) * -1))
    rotate(calc(var(--angle) * -1))
    scale(1);
}

/* The seeds burst outward */

.scene.open.burst .seed {
  animation: seedBurst 1100ms cubic-bezier(.22, 1, .36, 1) both;
  animation-delay: var(--delay);
}

@keyframes seedBurst {
  0% {
    opacity: 0;
    transform:
      translate(-50%, -50%)
      rotate(var(--angle))
      translateY(0)
      rotate(calc(var(--angle) * -1))
      scale(.3);
  }

  65% {
    opacity: 1;
  }

  100% {
    opacity: 1;
    transform:
      translate(-50%, -50%)
      rotate(var(--angle))
      translateY(calc(var(--radius) * -1))
      rotate(calc(var(--angle) * -1))
      scale(1);
  }
}

/* Bottom controls */

.hint {
  position: absolute;
  bottom: 2%;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  text-align: center;
  color: var(--muted);
  font-style: italic;
  font-size: 1rem;
  pointer-events: none;
}

.controls {
  position: absolute;
  right: 0;
  bottom: 1%;
  display: flex;
  gap: 8px;
}

.control,
.back {
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 250, 242, .9);
  color: var(--muted);
  padding: 10px 18px;
  cursor: pointer;
  font-size: .85rem;
  transition:
    border-color 250ms ease,
    color 250ms ease,
    background 250ms ease;
}

.control:hover,
.control:focus-visible,
.back:hover,
.back:focus-visible {
  border-color: var(--burgundy);
  color: var(--burgundy);
}

/* Section content */

.entry {
  width: min(100% - 32px, 620px);
  margin: 0 auto 72px;
  padding: 30px clamp(20px, 5vw, 42px) 36px;
  border-top: 1px solid #d9c3b9;
  background: rgba(255, 250, 242, .42);
}

.eyebrow {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: .76rem;
  letter-spacing: .15em;
  text-transform: uppercase;
}

.entry h2 {
  margin: 0;
  color: var(--burgundy);
  font-weight: normal;
  font-size: clamp(2rem, 5vw, 2.7rem);
}

.entry p {
  margin: 18px 0 26px;
  line-height: 1.85;
  color: #493936;
}

[hidden] {
  display: none !important;
}

/* Small screens */

@media (max-width: 620px) {
  .site-header {
    padding-inline: 22px;
  }

  .scene {
    width: 100%;
    height: 650px;
    min-height: 560px;
  }

  .whole-fruit {
    width: 96%;
  }

  .cross-section {
    width: 90%;
  }

  .seed {
    width: 11%;
    min-width: 36px;
  }

  .controls {
    right: 50%;
    transform: translateX(50%);
    bottom: -8%;
  }

  .hint {
    bottom: 4%;
  }
}

/* Reduced motion */

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <strong>The Gauri Archive</strong>
</header>

<main>

  <section class="hero" aria-label="Pomegranate archive">

    <div class="scene" id="scene">

      <!-- Whole pomegranate -->

      <button
        class="whole-fruit"
        id="openFruit"
        type="button"
        aria-label="Open the pomegranate"
      >
        <img
          src="./images/pomegranate-whole.png"
          alt="Whole pomegranate"
          onerror="this.style.display='none'; this.parentElement.dataset.error='whole'"
        >
      </button>

      <!-- Cross-section illustration -->

      <div class="cross-section" id="crossSection">
        <img
          src="./images/pomegranate-cross-section.png"
          alt="Pomegranate cross section"
          onerror="this.style.display='none'; this.parentElement.dataset.error='cross'"
        >
      </div>

      <!-- Individual seed illustrations -->

      <div class="orbit" id="orbit" aria-label="Archive sections"></div>

      <p class="hint" id="hint">
        Click the pomegranate to explore.
      </p>

      <div class="controls">

        <button
          class="control"
          id="pauseMotion"
          type="button"
          hidden
        >
          Pause motion
        </button>

        <button
          class="control"
          id="reset"
          type="button"
          hidden
        >
          Close archive
        </button>

      </div>

    </div>

  </section>

  <!-- Original section content -->

  <section class="entry" id="entry" hidden>

    <p class="eyebrow">The Gauri Archive</p>

    <h2 id="entryTitle"></h2>

    <p id="entryText"></p>

    <button class="back" id="back" type="button">
      Back to my world
    </button>

  </section>

</main>

<script>
(function () {
  "use strict";

  const interests = [
    {
      title: "Medicine",
      text: "Clinical learning, patient care and the questions that keep me curious."
    },
    {
      title: "Research & Innovation",
      text: "Research, med-tech experiments and ideas that might become something more."
    },
    {
      title: "Art, Culture & History",
      text: "Exploring how art, culture, history and economics shape one another."
    },
    {
      title: "Ideas & Writing",
      text: "Essays, opinions, observations and things I cannot stop thinking about."
    },
    {
      title: "SuperMoms",
      text: "Building ideas at the intersection of pregnancy, technology and care."
    },
    {
      title: "Experiences",
      text: "The experiences, people and moments that have shaped my journey."
    }
  ];

  const scene = document.getElementById("scene");
  const orbit = document.getElementById("orbit");
  const entry = document.getElementById("entry");
  const hint = document.getElementById("hint");
  const openFruit = document.getElementById("openFruit");
  const reset = document.getElementById("reset");
  const back = document.getElementById("back");
  const pauseMotion = document.getElementById("pauseMotion");

  const entryTitle = document.getElementById("entryTitle");
  const entryText = document.getElementById("entryText");

  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  );

  let isOpen = false;
  let isPaused = false;

  /* Create the six seeds */

  interests.forEach(function (item, index) {
    const seed = document.createElement("button");

    seed.className = "seed";
    seed.type = "button";
    seed.setAttribute("aria-label", item.title);

    seed.style.setProperty(
      "--angle",
      (index * 360 / interests.length) + "deg"
    );

    seed.style.setProperty(
      "--radius",
      "clamp(100px, 34%, 215px)"
    );

    seed.style.setProperty(
      "--delay",
      (index * 90) + "ms"
    );

    const image = document.createElement("img");

    image.src = "./images/seed" + (index + 1) + ".png";
    image.alt = "";

    image.onerror = function () {
      image.style.display = "none";
      seed.dataset.imageError = "true";
    };

    seed.appendChild(image);

    seed.addEventListener("click", function () {
      showEntry(item);
    });

    orbit.appendChild(seed);
  });

  /* Open the pomegranate */

  function openArchive() {
    if (isOpen) return;

    isOpen = true;

    scene.classList.add("open");

    reset.hidden = false;
    pauseMotion.hidden = false;

    hint.textContent = "Choose a seed to explore.";

    if (!reducedMotion.matches) {
      scene.classList.add("burst");
    }
  }

  openFruit.addEventListener("click", openArchive);

  /* Select a seed */

  function showEntry(item) {
    orbit.classList.add("paused");

    entryTitle.textContent = item.title;
    entryText.textContent = item.text;

    entry.hidden = false;

    entry.scrollIntoView({
      behavior: reducedMotion.matches ? "auto" : "smooth",
      block: "start"
    });
  }

  /* Return to the pomegranate */

  back.addEventListener("click", function () {
    entry.hidden = true;
    orbit.classList.remove("paused");
  });

  /* Pause and resume motion */

  pauseMotion.addEventListener("click", function () {
    isPaused = !isPaused;

    scene.classList.toggle("paused", isPaused);

    pauseMotion.textContent = isPaused
      ? "Resume motion"
      : "Pause motion";
  });

  /* Close the archive */

  function closeArchive() {
    isOpen = false;
    isPaused = false;

    scene.classList.remove("open", "burst", "paused");

    orbit.classList.remove("paused");

    entry.hidden = true;

    reset.hidden = true;
    pauseMotion.hidden = true;

    pauseMotion.textContent = "Pause motion";

    hint.textContent = "Click the pomegranate to explore.";

    openFruit.focus();
  }

  reset.addEventListener("click", closeArchive);

})();
</script>

</body>
</html>
