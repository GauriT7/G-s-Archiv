
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Gauri Archive</title>

<style>
:root {
  --paper: #f8f4e9;
  --cream: #fffaf0;
  --ink: #30221f;
  --muted: #88766d;
  --red: #a5002c;
  --line: #dfd4c7;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  background: var(--paper);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
}

button {
  font: inherit;
  color: inherit;
}

.site-header {
  height: 80px;
  padding: 0 clamp(22px, 6vw, 90px);
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--line);
}

.site-header a {
  color: var(--red);
  font-size: 19px;
  font-weight: bold;
  text-decoration: none;
}

/* -------------------------
   MAIN ARCHIVE
------------------------- */

.archive {
  min-height: calc(100svh - 80px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px 36px;
}

.archive-inner {
  width: 100%;
  max-width: 1000px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

/* -------------------------
   FRUIT STAGE
------------------------- */

.fruit-stage {
  position: relative;
  width: min(100%, 660px);
  height: clamp(390px, 64vw, 610px);
  display: grid;
  place-items: center;
  isolation: isolate;
}

/* Both illustrations share the same stage. */

.fruit {
  position: absolute;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* Whole fruit: initial screen. */

.whole-fruit {
  width: min(92%, 590px);
  height: 100%;
  opacity: 1;
  transform-origin: 50% 56%;
  animation: gentle-sway 5s ease-in-out infinite;
  transition:
    opacity 850ms ease,
    transform 1100ms cubic-bezier(.2,.8,.2,1);
  z-index: 2;
}

/* Cross-section: hidden until opening. */

.cross-section {
  width: min(78%, 480px);
  height: 100%;
  opacity: 0;
  transform: scale(.88) rotate(-3deg);
  transition:
    opacity 900ms ease,
    transform 1100ms cubic-bezier(.2,.8,.2,1);
  z-index: 1;
}

.archive-inner.opened .whole-fruit {
  opacity: 0;
  transform: scale(.72) rotate(10deg);
  animation: none;
}

.archive-inner.opened .cross-section {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

/* Make the whole fruit keyboard accessible. */

.whole-fruit {
  cursor: pointer;
}

.whole-fruit:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 6px;
  border-radius: 50%;
}

/* -------------------------
   TEMPORARY SEED BURST
------------------------- */

/*
   The burst particles are separate from the
   interactive seeds.

   They exist only during the transition.
   They never remain scattered on the page.
*/

.seed-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  overflow: visible;
}

.burst-seed {
  position: absolute;
  left: 50%;
  top: 50%;

  width: clamp(28px, 5vw, 48px);
  height: clamp(28px, 5vw, 48px);

  object-fit: contain;

  opacity: 0;
  visibility: hidden;

  --burst-x: 0px;
  --burst-y: 0px;
  --burst-rotation: 0deg;

  transform: translate(-50%, -50%) scale(.2);
}

/* Only animate when the burst is triggered. */

.archive-inner.bursting .burst-seed {
  visibility: visible;
  animation: seed-burst 1500ms
    cubic-bezier(.16,1,.3,1) forwards;
}

/* Stagger the seeds slightly. */

.archive-inner.bursting .burst-seed:nth-child(1) {
  --burst-x: -100px;
  --burst-y: -130px;
  --burst-rotation: -30deg;
  animation-delay: 0ms;
}

.archive-inner.bursting .burst-seed:nth-child(2) {
  --burst-x: 100px;
  --burst-y: -130px;
  --burst-rotation: 30deg;
  animation-delay: 70ms;
}

.archive-inner.bursting .burst-seed:nth-child(3) {
  --burst-x: -150px;
  --burst-y: -15px;
  --burst-rotation: -20deg;
  animation-delay: 140ms;
}

.archive-inner.bursting .burst-seed:nth-child(4) {
  --burst-x: 150px;
  --burst-y: -15px;
  --burst-rotation: 20deg;
  animation-delay: 210ms;
}

.archive-inner.bursting .burst-seed:nth-child(5) {
  --burst-x: -100px;
  --burst-y: 110px;
  --burst-rotation: 25deg;
  animation-delay: 280ms;
}

.archive-inner.bursting .burst-seed:nth-child(6) {
  --burst-x: 100px;
  --burst-y: 110px;
  --burst-rotation: -25deg;
  animation-delay: 350ms;
}

@keyframes seed-burst {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.2);
  }

  12% {
    opacity: 1;
  }

  65% {
    opacity: 1;
  }

  100% {
    opacity: 0;
    transform:
      translate(
        calc(-50% + var(--burst-x)),
        calc(-50% + var(--burst-y))
      )
      rotate(var(--burst-rotation))
      scale(.75);
  }
}

/* -------------------------
   INTERACTIVE SEEDS
------------------------- */

/*
   These are separate from the burst particles.

   They are placed inside the cross-section,
   not around the outside of the fruit.

   No circles or decorative containers.
*/

.seed-button {
  position: absolute;

  width: clamp(32px, 5vw, 48px);
  height: clamp(32px, 5vw, 48px);

  padding: 0;
  border: 0;
  background: transparent;

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transform: translate(-50%, -50%) scale(.6);

  z-index: 5;

  transition:
    opacity 450ms ease,
    transform 550ms cubic-bezier(.2,.8,.2,1);
}

.seed-button img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform 250ms ease;
}

.archive-inner.opened .seed-button {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}

/* All six hotspots remain inside the fruit. */

.archive-inner.opened .seed-button:nth-of-type(1) {
  left: 42%;
  top: 40%;
}

.archive-inner.opened .seed-button:nth-of-type(2) {
  left: 58%;
  top: 40%;
}

.archive-inner.opened .seed-button:nth-of-type(3) {
  left: 38%;
  top: 50%;
}

.archive-inner.opened .seed-button:nth-of-type(4) {
  left: 62%;
  top: 50%;
}

.archive-inner.opened .seed-button:nth-of-type(5) {
  left: 44%;
  top: 60%;
}

.archive-inner.opened .seed-button:nth-of-type(6) {
  left: 56%;
  top: 60%;
}

.seed-button:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 3px;
  border-radius: 50%;
}

@media (hover: hover) and (pointer: fine) {
  .seed-button:hover img {
    transform: scale(1.2) rotate(-8deg);
  }
}

/* -------------------------
   TEXT & CONTROLS
------------------------- */

.instruction {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: clamp(15px, 1.6vw, 18px);
  font-style: italic;
}

.archive-controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 24px;
}

.archive-button {
  padding: 11px 20px;
  border: 1px solid var(--line);
  border-radius: 30px;
  background: var(--cream);
  color: var(--muted);
  cursor: pointer;

  transition:
    color 250ms ease,
    border-color 250ms ease;
}

.archive-button:hover {
  color: var(--red);
  border-color: var(--red);
}

.archive-button:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 4px;
}

#backButton {
  display: none;
}

.archive-inner.opened #backButton {
  display: inline-block;
}

/* -------------------------
   RESPONSIVE
------------------------- */

@media (max-width: 600px) {
  .site-header {
    height: 64px;
  }

  .archive {
    min-height: calc(100svh - 64px);
    padding: 16px 10px 28px;
  }

  .fruit-stage {
    height: min(115vw, 480px);
  }

  .whole-fruit {
    width: 100%;
  }

  .cross-section {
    width: 90%;
  }

  .seed-button {
    width: 34px;
    height: 34px;
  }

  .archive-controls {
    margin-top: 20px;
  }
}

/* Respect reduced-motion preferences. */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

/* -------------------------
   GENTLE SWAY
------------------------- */

@keyframes gentle-sway {
  0%, 100% {
    transform: rotate(-2deg) translateY(0);
  }

  50% {
    transform: rotate(2deg) translateY(-7px);
  }
}

/* -------------------------
   POMEGRANATE CURSOR
------------------------- */

@media (hover: hover) and (pointer: fine) {
  body {
    cursor: url("images/seed1.png") 16 16, auto;
  }

  a,
  button {
    cursor: url("images/seed1.png") 16 16, pointer;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <a href="#" id="homeLink">The Gauri Archive</a>
</header>

<main>
  <section class="archive" id="archive">

    <div class="archive-inner" id="archiveInner">

      <div
        class="fruit-stage"
        id="fruitStage"
        aria-label="Pomegranate illustration"
      >

        <!-- Initial whole pomegranate -->

        <img
          class="fruit whole-fruit"
          id="wholeFruit"
          src="images/pomegranate-whole.png"
          alt="Whole pomegranate"
          draggable="false"
          tabindex="0"
          role="button"
          aria-label="Open the archive"
        >

        <!-- Cross-section illustration -->

        <img
          class="fruit cross-section"
          id="crossSection"
          src="images/pomegranate-cross-section.png"
          alt="Pomegranate cross-section"
          draggable="false"
        >

        <!-- Temporary burst particles -->

        <div class="seed-layer" aria-hidden="true">

          <img class="burst-seed"
               src="images/seed1.png" alt="">

          <img class="burst-seed"
               src="images/seed2.png" alt="">

          <img class="burst-seed"
               src="images/seed3.png" alt="">

          <img class="burst-seed"
               src="images/seed4.png" alt="">

          <img class="burst-seed"
               src="images/seed5.png" alt="">

          <img class="burst-seed"
               src="images/seed6.png" alt="">

        </div>

        <!-- Interactive seeds inside the fruit -->

        <button class="seed-button"
                type="button"
                aria-label="Explore seed 1">
          <img src="images/seed1.png" alt="">
        </button>

        <button class="seed-button"
                type="button"
                aria-label="Explore seed 2">
          <img src="images/seed2.png" alt="">
        </button>

        <button class="seed-button"
                type="button"
                aria-label="Explore seed 3">
          <img src="images/seed3.png" alt="">
        </button>

        <button class="seed-button"
                type="button"
                aria-label="Explore seed 4">
          <img src="images/seed4.png" alt="">
        </button>

        <button class="seed-button"
                type="button"
                aria-label="Explore seed 5">
          <img src="images/seed5.png" alt="">
        </button>

        <button class="seed-button"
                type="button"
                aria-label="Explore seed 6">
          <img src="images/seed6.png" alt="">
        </button>

      </div>

      <p class="instruction" id="instruction">
        Click the pomegranate to explore.
      </p>

      <div class="archive-controls">

        <button
          class="archive-button"
          id="backButton"
          type="button"
        >
          Close archive
        </button>

      </div>

    </div>

  </section>
</main>

<script>
(() => {
  const archiveInner = document.getElementById("archiveInner");
  const wholeFruit = document.getElementById("wholeFruit");
  const backButton = document.getElementById("backButton");
  const homeLink = document.getElementById("homeLink");
  const instruction = document.getElementById("instruction");

  const seedButtons = document.querySelectorAll(".seed-button");

  let isOpen = false;
  let burstTimer = null;

  function openArchive() {
    if (isOpen) return;

    isOpen = true;

    archiveInner.classList.add("opened");

    // Trigger the burst only when opening.
    archiveInner.classList.remove("bursting");

    // Force a fresh animation on every opening.
    void archiveInner.offsetWidth;

    archiveInner.classList.add("bursting");

    instruction.textContent = "Choose a seed to explore.";

    // Remove burst particles after the animation.
    clearTimeout(burstTimer);

    burstTimer = setTimeout(() => {
      archiveInner.classList.remove("bursting");
    }, 2200);

    backButton.focus({ preventScroll: true });
  }

  function closeArchive() {
    if (!isOpen) return;

    isOpen = false;

    clearTimeout(burstTimer);

    archiveInner.classList.remove("opened");
    archiveInner.classList.remove("bursting");

    instruction.textContent =
      "Click the pomegranate to explore.";

    wholeFruit.focus({ preventScroll: true });
  }

  // Open the archive by clicking the whole fruit.
  wholeFruit.addEventListener("click", openArchive);

  // Keyboard access for the whole fruit.
  wholeFruit.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openArchive();
    }
  });

  // Close the archive.
  backButton.addEventListener("click", closeArchive);

  // Clicking the archive name returns to the initial screen.
  homeLink.addEventListener("click", (event) => {
    event.preventDefault();

    if (isOpen) {
      closeArchive();
    } else {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });

  // Interactive seeds.
  seedButtons.forEach((button, index) => {
    button.addEventListener("click", () => {
      instruction.textContent =
        `Seed ${index + 1} selected.`;
    });
  });

  // Escape returns to the whole pomegranate.
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && isOpen) {
      closeArchive();
    }
  });

  // Report missing images in the browser console.
  document.querySelectorAll("img").forEach((image) => {
    image.addEventListener("error", () => {
      console.error(
        "Could not load image:",
        image.getAttribute("src")
      );
    });
  });
})();
</script>

</body>
</html>
