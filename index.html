
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faf5eb">

<title>The Gauri Archive</title>

<style>
:root {
  --burgundy: #9e0124;
  --deep-burgundy: #6f0b24;
  --ivory: #faf5eb;
  --paper: #fffaf2;
  --ink: #30221f;
  --muted: #836f68;
  --line: #dfd1c4;
  --blush: #f8ebdd;
  --gold: #c9a66b;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  background: var(--ivory);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
}

button {
  font: inherit;
}

button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--burgundy);
  outline-offset: 5px;
}

[hidden] {
  display: none !important;
}

/* --------------------------------
   HEADER
-------------------------------- */

.site-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 22px clamp(20px, 6vw, 92px);
  border-bottom: 1px solid var(--line);
}

.site-header strong {
  color: var(--burgundy);
  font-size: 1rem;
  font-weight: 600;
}

.site-header span {
  color: var(--muted);
  font-size: 0.82rem;
  letter-spacing: 0.12em;
}

/* --------------------------------
   HERO
-------------------------------- */

.hero {
  min-height: 100vh;
  padding: 30px 18px 70px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.eyebrow {
  margin: 0 0 18px;
  color: var(--muted);
  font-size: 0.76rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  color: var(--ink);
  font-size: clamp(3rem, 8vw, 6.5rem);
  font-weight: 500;
  letter-spacing: -0.065em;
  line-height: 1.05;
}

.subtitle {
  margin: 16px 0 0;
  color: var(--muted);
  font-size: clamp(1rem, 2vw, 1.25rem);
  font-style: italic;
}

/* --------------------------------
   POMEGRANATE SCENE
-------------------------------- */

.scene {
  position: relative;
  width: min(100%, 1000px);
  height: clamp(530px, 70vw, 760px);
  margin: 20px auto 0;
  isolation: isolate;
}

.whole-fruit,
.cross-section {
  position: absolute;
  left: 50%;
  top: 50%;
  display: block;
  padding: 0;
  border: 0;
  background: transparent;
  transform: translate(-50%, -50%);
}

.whole-fruit {
  z-index: 2;
  width: min(78%, 650px);
  cursor: pointer;
  transition:
    opacity 800ms ease,
    transform 1100ms cubic-bezier(.2,.8,.2,1);
}

.whole-fruit img,
.cross-section img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}

.whole-fruit:hover {
  transform: translate(-50%, -50%) scale(1.025);
}

.cross-section {
  z-index: 1;
  width: min(55%, 450px);
  opacity: 0;
  visibility: hidden;
  transform: translate(-50%, -50%) scale(.8);
  transition:
    opacity 900ms ease,
    transform 1100ms cubic-bezier(.2,.8,.2,1),
    visibility 0s linear 1100ms;
  pointer-events: none;
}

/* The fruit disappears.
   The cross-section takes its place.
   Both stay centred in the same scene. */

.scene.open .whole-fruit {
  opacity: 0;
  transform: translate(-50%, -50%) scale(.75);
  pointer-events: none;
}

.scene.open .cross-section {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, -50%) scale(1);
  transition-delay: 0s;
}

/* --------------------------------
   SEEDS
-------------------------------- */

.orbit {
  position: absolute;
  inset: 0;
  z-index: 3;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 700ms ease;
}

.scene.open .orbit {
  opacity: 1;
  visibility: visible;
  transition-delay: 250ms;
}

.seed {
  --angle: 0deg;
  --radius: 180px;

  position: absolute;
  left: 50%;
  top: 50%;

  width: clamp(58px, 8vw, 76px);
  aspect-ratio: 1;

  display: grid;
  place-items: center;

  padding: 8px;
  border: 1px solid #e3b5a9;
  border-radius: 50%;

  background: var(--paper);
  cursor: pointer;
  pointer-events: auto;

  /* Fixed radial positions.
     No continuous rotation. */

  transform:
    translate(-50%, -50%)
    rotate(var(--angle))
    translateY(calc(var(--radius) * -1))
    rotate(calc(var(--angle) * -1));

  opacity: 0;
  transition:
    opacity 600ms ease,
    background 250ms ease,
    border-color 250ms ease,
    box-shadow 250ms ease;
}

.scene.open .seed {
  opacity: 1;
}

/* Each seed stays in its own position. */

.seed img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.seed:hover,
.seed:focus-visible,
.seed.active {
  background: var(--blush);
  border-color: var(--burgundy);
  box-shadow: 0 0 0 4px rgba(158, 1, 36, .10);
}

.seed.active {
  transform:
    translate(-50%, -50%)
    rotate(var(--angle))
    translateY(calc(var(--radius) * -1))
    rotate(calc(var(--angle) * -1))
    scale(1.08);
}

/* Seed positions around the cross-section */

.seed:nth-child(1) {
  --angle: 0deg;
  --radius: 185px;
}

.seed:nth-child(2) {
  --angle: 60deg;
  --radius: 185px;
}

.seed:nth-child(3) {
  --angle: 120deg;
  --radius: 185px;
}

.seed:nth-child(4) {
  --angle: 180deg;
  --radius: 185px;
}

.seed:nth-child(5) {
  --angle: 240deg;
  --radius: 185px;
}

.seed:nth-child(6) {
  --angle: 300deg;
  --radius: 185px;
}

/* --------------------------------
   SECTION LABELS
-------------------------------- */

.section-label {
  position: absolute;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  width: 160px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 0.85rem;
  line-height: 1.4;
  transition:
    color 250ms ease,
    transform 250ms ease;
}

.section-label:hover {
  color: var(--burgundy);
  transform: translateY(-3px);
}

.section-label span {
  display: grid;
  place-items: center;
  width: 78px;
  height: 92px;
  border: 1px solid #e3b5a9;
  border-radius: 50%;
  background: var(--paper);
  color: var(--burgundy);
  box-shadow: 0 8px 24px rgba(70, 30, 25, .04);
  transition:
    background 250ms ease,
    border-color 250ms ease;
}

.section-label:hover span {
  background: var(--blush);
  border-color: var(--burgundy);
}

/* Original section positions */

.label-medicine {
  top: 0;
  left: 50%;
  transform: translateX(-50%);
}

.label-experiences {
  top: 17%;
  left: 8%;
}

.label-research {
  top: 17%;
  right: 8%;
}

.label-supermoms {
  bottom: 16%;
  left: 6%;
}

.label-culture {
  bottom: 16%;
  right: 6%;
}

.label-writing {
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
}

/* Keep the hover movement centred for top/bottom labels */

.label-medicine:hover,
.label-writing:hover {
  transform: translateX(-50%) translateY(-3px);
}

/* --------------------------------
   HINT AND CONTROLS
-------------------------------- */

.hint {
  margin: -5px 0 0;
  color: var(--muted);
  font-size: 0.95rem;
  font-style: italic;
  text-align: center;
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 24px;
}

.control-button {
  padding: 11px 20px;
  border: 1px solid var(--line);
  border-radius: 30px;
  background: var(--paper);
  color: var(--muted);
  cursor: pointer;
  font-size: 0.85rem;
  transition:
    background 250ms ease,
    color 250ms ease,
    border-color 250ms ease;
}

.control-button:hover {
  border-color: var(--burgundy);
  color: var(--burgundy);
}

.control-button.primary {
  background: var(--burgundy);
  border-color: var(--burgundy);
  color: var(--ivory);
}

.control-button.primary:hover {
  background: var(--deep-burgundy);
}

/* --------------------------------
   SECTION VIEWER
-------------------------------- */

.section-viewer {
  width: min(100%, 760px);
  margin: 70px auto 0;
  padding: 42px clamp(20px, 5vw, 60px);
  border-top: 1px solid var(--line);
  text-align: center;
  animation: appear 500ms ease both;
}

.section-viewer h2 {
  margin: 0;
  color: var(--burgundy);
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 500;
}

.section-viewer p {
  margin: 15px auto 0;
  max-width: 480px;
  color: var(--muted);
  font-size: 1rem;
  line-height: 1.8;
}

.section-viewer .control-button {
  margin-top: 24px;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* --------------------------------
   FOOTER
-------------------------------- */

footer {
  padding: 30px 20px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 0.78rem;
  text-align: center;
}

/* --------------------------------
   RESPONSIVE
-------------------------------- */

@media (max-width: 700px) {
  .hero {
    padding-inline: 10px;
  }

  .scene {
    height: 560px;
    max-width: 500px;
  }

  .whole-fruit {
    width: 88%;
  }

  .cross-section {
    width: 65%;
  }

  .seed {
    width: 58px;
    padding: 6px;
  }

  .seed:nth-child(1) {
    --radius: 145px;
  }

  .seed:nth-child(2) {
    --radius: 145px;
  }

  .seed:nth-child(3) {
    --radius: 145px;
  }

  .seed:nth-child(4) {
    --radius: 145px;
  }

  .seed:nth-child(5) {
    --radius: 145px;
  }

  .seed:nth-child(6) {
    --radius: 145px;
  }

  .section-label {
    width: 115px;
    font-size: 0.75rem;
  }

  .section-label span {
    width: 62px;
    height: 72px;
  }

  .label-experiences {
    left: 0;
    top: 22%;
  }

  .label-research {
    right: 0;
    top: 22%;
  }

  .label-supermoms {
    left: 0;
    bottom: 20%;
  }

  .label-culture {
    right: 0;
    bottom: 20%;
  }

  .hint {
    margin-top: 0;
  }
}

@media (max-width: 420px) {
  .scene {
    height: 500px;
  }

  .seed:nth-child(1) {
    --radius: 125px;
  }

  .seed:nth-child(2) {
    --radius: 125px;
  }

  .seed:nth-child(3) {
    --radius: 125px;
  }

  .seed:nth-child(4) {
    --radius: 125px;
  }

  .seed:nth-child(5) {
    --radius: 125px;
  }

  .seed:nth-child(6) {
    --radius: 125px;
  }

  .section-label {
    width: 100px;
    font-size: 0.7rem;
  }

  .section-label span {
    width: 54px;
    height: 64px;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <strong>The Gauri Archive</strong>
  <span>A PERSONAL ARCHIVE</span>
</header>

<main>

  <section class="hero" id="archive">

    <p class="eyebrow">A PERSONAL ARCHIVE</p>

    <h1>Inside my world.</h1>

    <p class="subtitle">
      A little bit of everything that makes me, me.
    </p>

    <div class="scene" id="scene">

      <!-- WHOLE POMEGRANATE -->

      <button
        class="whole-fruit"
        id="openFruit"
        aria-label="Open the pomegranate"
      >
        <img
          src="images/whole-pomegranate.png"
          alt="Whole pomegranate"
          draggable="false"
        >
      </button>

      <!-- CROSS-SECTION -->

      <div class="cross-section" id="crossSection">
        <img
          src="images/cross-section.png"
          alt="Pomegranate cross-section"
          draggable="false"
        >
      </div>

      <!-- SIX SEEDS -->

      <div class="orbit" id="orbit">

        <button class="seed" data-section="medicine"
          aria-label="Medicine">
          <img src="images/seed1.png" alt="" draggable="false">
        </button>

        <button class="seed" data-section="experiences"
          aria-label="Experiences">
          <img src="images/seed2.png" alt="" draggable="false">
        </button>

        <button class="seed" data-section="research"
          aria-label="Research and Innovation">
          <img src="images/seed3.png" alt="" draggable="false">
        </button>

        <button class="seed" data-section="supermoms"
          aria-label="SuperMoms">
          <img src="images/seed4.png" alt="" draggable="false">
        </button>

        <button class="seed" data-section="culture"
          aria-label="Art, Culture and History">
          <img src="images/seed5.png" alt="" draggable="false">
        </button>

        <button class="seed" data-section="writing"
          aria-label="Ideas and Writing">
          <img src="images/seed6.png" alt="" draggable="false">
        </button>

      </div>

      <!-- ORIGINAL SECTION LABELS -->

      <button class="section-label label-medicine"
        data-section="medicine">
        <span>✳</span>
        Medicine
      </button>

      <button class="section-label label-experiences"
        data-section="experiences">
        <span>♡</span>
        Experiences
      </button>

      <button class="section-label label-research"
        data-section="research">
        <span>☆</span>
        Research &amp; Innovation
      </button>

      <button class="section-label label-supermoms"
        data-section="supermoms">
        <span>♡</span>
        SuperMoms
      </button>

      <button class="section-label label-culture"
        data-section="culture">
        <span>♡</span>
        Art, Culture &amp; History
      </button>

      <button class="section-label label-writing"
        data-section="writing">
        <span>✳</span>
        Ideas &amp; Writing
      </button>

    </div>

    <p class="hint" id="hint">
      Choose a seed to explore.
    </p>

    <div class="controls">

      <button
        class="control-button"
        id="motionButton"
        hidden
      >
        Pause motion
      </button>

      <button
        class="control-button"
        id="closeArchive"
        hidden
      >
        Close archive
      </button>

    </div>

    <!-- SECTION CONTENT -->

    <section
      class="section-viewer"
      id="sectionViewer"
      aria-live="polite"
      hidden
    >
      <h2 id="sectionTitle"></h2>

      <p id="sectionDescription"></p>

      <button
        class="control-button"
        id="backButton"
      >
        Back to my world
      </button>
    </section>

  </section>

</main>

<footer>
  The Gauri Archive
</footer>

<script>
(() => {
  const scene = document.getElementById("scene");
  const openFruit = document.getElementById("openFruit");
  const motionButton = document.getElementById("motionButton");
  const closeArchive = document.getElementById("closeArchive");
  const hint = document.getElementById("hint");

  const sectionViewer = document.getElementById("sectionViewer");
  const sectionTitle = document.getElementById("sectionTitle");
  const sectionDescription = document.getElementById("sectionDescription");
  const backButton = document.getElementById("backButton");

  const seeds = document.querySelectorAll(".seed");
  const sectionButtons = document.querySelectorAll("[data-section]");

  const sections = {
    medicine: {
      title: "Medicine",
      description: "A space for my journey in medicine."
    },

    experiences: {
      title: "Experiences",
      description: "The experiences that make me who I am."
    },

    research: {
      title: "Research & Innovation",
      description: "My research, ideas and explorations."
    },

    supermoms: {
      title: "SuperMoms",
      description: "A project close to my heart."
    },

    culture: {
      title: "Art, Culture & History",
      description: "The things that inspire me beyond medicine."
    },

    writing: {
      title: "Ideas & Writing",
      description: "Thoughts, ideas and things I want to write."
    }
  };

  let isOpen = false;
  let isPaused = false;

  function openArchive() {
    if (isOpen) return;

    isOpen = true;
    scene.classList.add("open");

    openFruit.setAttribute("aria-expanded", "true");

    motionButton.hidden = false;
    closeArchive.hidden = false;

    hint.textContent = "Choose a seed to explore.";
  }

  function closeTheArchive() {
    isOpen = false;
    isPaused = false;

    scene.classList.remove("open");

    openFruit.setAttribute("aria-expanded", "false");

    motionButton.hidden = true;
    closeArchive.hidden = true;

    motionButton.textContent = "Pause motion";

    sectionViewer.hidden = true;

    seeds.forEach(seed => {
      seed.classList.remove("active");
    });

    hint.textContent = "Choose a seed to explore.";
  }

  function toggleMotion() {
    isPaused = !isPaused;

    /*
      Seeds do not rotate.
      This button pauses or resumes the
      opening animation only.
    */

    if (isPaused) {
      scene.classList.add("paused");
      motionButton.textContent = "Resume motion";
    } else {
      scene.classList.remove("paused");
      motionButton.textContent = "Pause motion";
    }
  }

  function openSection(sectionName) {
    const section = sections[sectionName];

    if (!section) return;

    if (!isOpen) {
      openArchive();
    }

    seeds.forEach(seed => {
      seed.classList.toggle(
        "active",
        seed.dataset.section === sectionName
      );
    });

    sectionTitle.textContent = section.title;
    sectionDescription.textContent = section.description;

    sectionViewer.hidden = false;

    sectionViewer.scrollIntoView({
      behavior: window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches ? "auto" : "smooth",
      block: "nearest"
    });
  }

  openFruit.addEventListener("click", openArchive);

  closeArchive.addEventListener("click", closeTheArchive);

  motionButton.addEventListener("click", toggleMotion);

  backButton.addEventListener("click", () => {
    sectionViewer.hidden = true;

    seeds.forEach(seed => {
      seed.classList.remove("active");
    });
  });

  sectionButtons.forEach(button => {
    button.addEventListener("click", () => {
      openSection(button.dataset.section);
    });
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      if (!sectionViewer.hidden) {
        sectionViewer.hidden = true;
      } else if (isOpen) {
        closeTheArchive();
      }
    }
  });

})();
</script>

</body>
</html>
