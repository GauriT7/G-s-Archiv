
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faf5eb">

<title>The Gauri Archive</title>

<style>
:root {
  --burgundy: #9e0124;
  --deep-burgundy: #6f0b24;
  --ivory: #faf5eb;
  --paper: #fffaf2;
  --ink: #30221f;
  --muted: #836f68;
  --line: #dfd1c4;
  --blush: #f8ebdd;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  background: var(--ivory);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
}

button {
  font: inherit;
}

button:focus-visible {
  outline: 2px solid var(--burgundy);
  outline-offset: 5px;
}

/* HEADER */

.site-header {
  padding: 22px clamp(22px, 6vw, 92px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
}

.site-header strong {
  color: var(--burgundy);
  font-size: 1.02rem;
}

.site-header span {
  color: var(--muted);
  font-size: .85rem;
}

/* INTRODUCTION */

.intro {
  padding: 52px 20px 0;
  text-align: center;
}

.eyebrow {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: .76rem;
  letter-spacing: .17em;
  text-transform: uppercase;
}

.intro h1 {
  margin: 0;
  font-size: clamp(3rem, 8vw, 5.5rem);
  font-weight: normal;
  letter-spacing: -.045em;
  line-height: 1.05;
}

.intro p {
  margin: 18px auto 0;
  color: var(--muted);
  font-size: clamp(1rem, 2vw, 1.2rem);
  font-style: italic;
}

/* MAIN POMEGRANATE */

.hero {
  width: 100%;
  padding: 20px 16px 70px;
}

.scene {
  position: relative;
  width: min(100%, 850px);
  height: clamp(560px, 72vw, 780px);
  margin: 0 auto;
  display: grid;
  place-items: center;
  isolation: isolate;
}

/* Both illustrations occupy the SAME centre. */

.whole-fruit,
.cross-section {
  position: absolute;
  left: 50%;
  top: 50%;
  display: block;
  width: min(88%, 640px);
  max-height: 94%;
  object-fit: contain;
  transform: translate(-50%, -50%);
}

.whole-fruit {
  z-index: 2;
  border: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
  transition:
    opacity 700ms ease,
    scale 900ms ease,
    rotate 900ms ease;
}

.whole-fruit img,
.cross-section img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}

.whole-fruit:hover {
  scale: 1.025;
  rotate: -1deg;
}

.cross-section {
  z-index: 1;
  opacity: 0;
  pointer-events: none;
  scale: .88;
  rotate: -3deg;
  transition:
    opacity 850ms ease,
    scale 1000ms cubic-bezier(.2,.7,.2,1),
    rotate 1000ms ease;
}

/* OPEN STATE */

.scene.open .whole-fruit {
  opacity: 0;
  pointer-events: none;
  scale: .82;
  rotate: 4deg;
}

.scene.open .cross-section {
  opacity: 1;
  scale: 1;
  rotate: 0deg;
}

/* SEEDS */

.orbit {
  position: absolute;
  inset: 0;
  z-index: 3;
  opacity: 0;
  pointer-events: none;
  scale: .92;
  transition:
    opacity 700ms ease,
    scale 900ms ease;
}

.scene.open .orbit {
  opacity: 1;
  pointer-events: auto;
  scale: 1;
}

/*
Seeds stay in fixed positions.
No orbit rotation or counter-rotation.
*/

.seed {
  position: absolute;
  left: 50%;
  top: 50%;

  width: clamp(56px, 9%, 76px);
  aspect-ratio: 1;

  display: grid;
  place-items: center;

  padding: 7px;
  border: 1px solid #e3b5a9;
  border-radius: 50%;
  background: var(--paper);

  cursor: pointer;

  transform:
    translate(-50%, -50%)
    rotate(var(--angle))
    translateY(calc(var(--radius) * -1))
    rotate(calc(var(--angle) * -1));

  transition:
    background 250ms ease,
    border-color 250ms ease,
    box-shadow 250ms ease,
    scale 250ms ease;
}

.seed img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

.seed:hover,
.seed:focus-visible {
  background: var(--blush);
  border-color: var(--burgundy);
  box-shadow: 0 0 0 4px rgba(158, 1, 36, .12);
  scale: 1.08;
}

/* Six fixed positions around the fruit */

.seed:nth-child(1) {
  --angle: 0deg;
}

.seed:nth-child(2) {
  --angle: 60deg;
}

.seed:nth-child(3) {
  --angle: 120deg;
}

.seed:nth-child(4) {
  --angle: 180deg;
}

.seed:nth-child(5) {
  --angle: 240deg;
}

.seed:nth-child(6) {
  --angle: 300deg;
}

/* INSTRUCTIONS AND CONTROLS */

.hint {
  position: absolute;
  left: 50%;
  bottom: 0;

  width: max-content;
  max-width: 90%;

  margin: 0;
  color: var(--muted);
  font-size: .9rem;
  font-style: italic;
  text-align: center;

  transform: translateX(-50%);
}

.controls {
  position: absolute;
  right: 0;
  bottom: 0;

  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}

.control,
.back {
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 250, 242, .9);
  color: var(--muted);
  padding: 9px 15px;
  cursor: pointer;
  font-size: .82rem;
}

.control:hover,
.back:hover {
  border-color: var(--burgundy);
  color: var(--burgundy);
}

/* SECTION CONTENT */

.entry {
  width: min(calc(100% - 32px), 680px);
  margin: 0 auto 80px;
  padding: 34px clamp(20px, 5vw, 46px) 40px;

  border-top: 1px solid #d9c3b9;
  background: rgba(255, 250, 242, .42);
}

.entry[hidden] {
  display: none;
}

.entry h2 {
  margin: 0;
  color: var(--burgundy);
  font-size: clamp(2rem, 5vw, 2.7rem);
  font-weight: normal;
}

.entry p {
  margin: 20px 0 28px;
  color: #493936;
  line-height: 1.85;
  font-size: 1rem;
}

.back {
  border-color: var(--burgundy);
  color: var(--burgundy);
}

/* MOBILE */

@media (max-width: 620px) {
  .intro {
    padding-top: 42px;
  }

  .hero {
    padding-inline: 8px;
  }

  .scene {
    height: 560px;
  }

  .whole-fruit {
    width: 94%;
  }

  .cross-section {
    width: 82%;
  }

  .seed {
    width: 56px;
    padding: 5px;
  }

  .seed:nth-child(1) {
    --radius: 165px;
  }

  .seed:nth-child(2) {
    --radius: 165px;
  }

  .seed:nth-child(3) {
    --radius: 165px;
  }

  .seed:nth-child(4) {
    --radius: 165px;
  }

  .seed:nth-child(5) {
    --radius: 165px;
  }

  .seed:nth-child(6) {
    --radius: 165px;
  }

  .controls {
    right: 50%;
    bottom: -42px;
    transform: translateX(50%);
  }

  .hint {
    bottom: 12px;
  }
}

/* ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <strong>The Gauri Archive</strong>
  <span>A personal archive</span>
</header>

<main>

  <section class="intro">
    <p class="eyebrow">A personal archive</p>
    <h1>Inside my world.</h1>
    <p>A little bit of everything that makes me, me.</p>
  </section>

  <section class="hero" aria-label="Explore the archive">

    <div class="scene" id="scene">

      <!-- Whole pomegranate -->

      <button
        class="whole-fruit"
        id="openFruit"
        type="button"
        aria-label="Open the pomegranate"
        aria-expanded="false"
      >
        <img
          src="./images/whole-pomegranate.png"
          alt="Whole illustrated pomegranate"
        >
      </button>

      <!-- Cross-section: remains centred -->

      <div class="cross-section" id="crossSection">
        <img
          src="./images/cross-section-pomegranate.png"
          alt="Illustrated pomegranate cross-section"
        >
      </div>

      <!-- Six clickable seeds -->

      <div class="orbit" id="orbit">

        <button class="seed" type="button" data-section="medicine"
          aria-label="Explore Medicine">
          <img src="./images/seed1.png" alt="">
        </button>

        <button class="seed" type="button" data-section="research"
          aria-label="Explore Research and Innovation">
          <img src="./images/seed2.png" alt="">
        </button>

        <button class="seed" type="button" data-section="culture"
          aria-label="Explore Art, Culture and History">
          <img src="./images/seed3.png" alt="">
        </button>

        <button class="seed" type="button" data-section="writing"
          aria-label="Explore Ideas and Writing">
          <img src="./images/seed4.png" alt="">
        </button>

        <button class="seed" type="button" data-section="supermoms"
          aria-label="Explore SuperMoms">
          <img src="./images/seed5.png" alt="">
        </button>

        <button class="seed" type="button" data-section="experiences"
          aria-label="Explore Experiences">
          <img src="./images/seed6.png" alt="">
        </button>

      </div>

      <p class="hint" id="hint" aria-live="polite">
        A universe within. Click to explore.
      </p>

      <div class="controls">

        <button class="control" id="resume" type="button" hidden>
          Resume motion
        </button>

        <button class="control" id="reset" type="button" hidden>
          Close archive
        </button>

      </div>

    </div>
  </section>

  <!-- Original six archive sections -->

  <section class="entry" id="entry" hidden aria-live="polite">

    <p class="eyebrow">A little piece of my world</p>

    <h2 id="entryTitle"></h2>

    <p id="entryText"></p>

    <button class="back" id="back" type="button">
      Back to the pomegranate
    </button>

  </section>

</main>

<script>
const interests = {
  medicine: {
    title: "Medicine",
    text: "Clinical learning, patient care and the questions that keep me curious."
  },

  research: {
    title: "Research & Innovation",
    text: "Research, med-tech experiments and ideas that might become something more."
  },

  culture: {
    title: "Art, Culture & History",
    text: "Exploring how art, culture, history and economics shape one another."
  },

  writing: {
    title: "Ideas & Writing",
    text: "Essays, opinions, observations and things I cannot stop thinking about."
  },

  supermoms: {
    title: "SuperMoms",
    text: "Building ideas at the intersection of pregnancy, technology and care."
  },

  experiences: {
    title: "Experiences",
    text: "The experiences, people and moments that have shaped my journey."
  }
};

const scene = document.getElementById("scene");
const openFruit = document.getElementById("openFruit");
const orbit = document.getElementById("orbit");
const entry = document.getElementById("entry");
const hint = document.getElementById("hint");
const reset = document.getElementById("reset");
const resume = document.getElementById("resume");
const back = document.getElementById("back");

let selectedSection = null;
let isOpen = false;

function openArchive() {
  if (isOpen) return;

  isOpen = true;

  scene.classList.add("open");

  openFruit.setAttribute("aria-expanded", "true");

  reset.hidden = false;
  resume.hidden = true;

  hint.textContent = "Choose a seed to explore.";
}

function showEntry(section) {
  const item = interests[section];

  if (!item) return;

  selectedSection = section;

  // Pause all movement while the reader explores.
  orbit.style.animationPlayState = "paused";

  document.getElementById("entryTitle").textContent = item.title;
  document.getElementById("entryText").textContent = item.text;

  entry.hidden = false;

  hint.textContent = item.title;

  entry.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function returnToSeeds() {
  entry.hidden = true;

  selectedSection = null;

  hint.textContent = "Choose a seed to explore.";

  scene.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}

function closeArchive() {
  entry.hidden = true;

  scene.classList.remove("open");

  openFruit.setAttribute("aria-expanded", "false");

  reset.hidden = true;
  resume.hidden = true;

  isOpen = false;
  selectedSection = null;

  hint.textContent = "A universe within. Click to explore.";

  openFruit.focus();
}

// Open the pomegranate.
openFruit.addEventListener("click", openArchive);

// Each seed opens its corresponding section.
document.querySelectorAll(".seed").forEach(function(seed) {
  seed.addEventListener("click", function() {
    showEntry(seed.dataset.section);
  });
});

// Return from a section to the seeds.
back.addEventListener("click", returnToSeeds);

// Close the entire archive.
reset.addEventListener("click", closeArchive);

// Keep the motion control functional without moving the fruit.
resume.addEventListener("click", function() {
  hint.textContent = selectedSection
    ? interests[selectedSection].title
    : "Choose a seed to explore.";
});

// Escape closes the archive.
document.addEventListener("keydown", function(event) {
  if (event.key === "Escape" && isOpen) {
    closeArchive();
  }
});
</script>

</body>
</html>
