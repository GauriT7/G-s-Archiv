
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Gauri Archive</title>

  <style>
    :root {
      --cream: #f8f4e9;
      --burgundy: #a0002b;
      --dark-burgundy: #69001d;
      --text: #39272b;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    /* HEADER */

    header {
      height: 80px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #e1d8cb;
    }

    .brand {
      color: var(--burgundy);
      font-size: 20px;
      font-weight: bold;
    }

    /* PAGE LAYOUT */

    .page {
      min-height: calc(100svh - 80px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 20px 28px;
    }

    .screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .screen[hidden] {
      display: none;
    }

    /* OPENING POMEGRANATE */

    .fruit-button {
      position: relative;
      display: grid;
      place-items: center;
      width: min(78vw, 590px);
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .fruit-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: 50% 55%;
      animation: sway 4.5s ease-in-out infinite;
      user-select: none;
      -webkit-user-drag: none;
    }

    .fruit-button:focus-visible {
      outline: 2px solid var(--burgundy);
      outline-offset: 8px;
      border-radius: 50%;
    }

    @keyframes sway {
      0%, 100% {
        transform: rotate(-2deg);
      }

      50% {
        transform: rotate(2deg);
      }
    }

    .instruction {
      margin: 20px 0 0;
      color: #88777a;
      font-size: 19px;
      font-style: italic;
      text-align: center;
    }

    /* CROSS-SECTION SCREEN */

    .cross-stage {
      position: relative;
      width: min(94vw, 850px);
      height: min(68vw, 650px);
      min-height: 390px;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .cross-section {
      position: relative;
      z-index: 2;
      width: min(66%, 530px);
      height: 100%;
      display: grid;
      place-items: center;
    }

    .cross-section img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* SIX SEEDS IN A BALANCED ORBIT */

    .seed {
      position: absolute;
      z-index: 3;
      width: clamp(66px, 10vw, 105px);
      height: clamp(66px, 10vw, 105px);
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .seed img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .seed-1 {
      top: 7%;
      left: 13%;
      transform: rotate(-18deg);
    }

    .seed-2 {
      top: 7%;
      right: 13%;
      transform: rotate(18deg);
    }

    .seed-3 {
      top: 39%;
      left: 0;
      transform: rotate(-35deg);
    }

    .seed-4 {
      top: 39%;
      right: 0;
      transform: rotate(35deg);
    }

    .seed-5 {
      bottom: 7%;
      left: 13%;
      transform: rotate(18deg);
    }

    .seed-6 {
      bottom: 7%;
      right: 13%;
      transform: rotate(-18deg);
    }

    /* SMOOTH TRANSITION */

    .screen {
      opacity: 1;
      transform: translateY(0);
    }

    .screen.entering {
      animation: screen-enter 850ms cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes screen-enter {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fruit-button.bursting img {
      animation: fruit-burst 850ms cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes fruit-burst {
      0% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }

      35% {
        transform: scale(1.13) rotate(-3deg);
        opacity: 1;
      }

      100% {
        transform: scale(.68) rotate(4deg);
        opacity: 0;
      }
    }

    .seed {
      opacity: 0;
    }

    .screen.entering .seed {
      animation: seed-arrive 900ms cubic-bezier(.22, 1, .36, 1) both;
    }

    .screen.entering .seed-1 {
      animation-delay: 80ms;
    }

    .screen.entering .seed-2 {
      animation-delay: 140ms;
    }

    .screen.entering .seed-3 {
      animation-delay: 200ms;
    }

    .screen.entering .seed-4 {
      animation-delay: 260ms;
    }

    .screen.entering .seed-5 {
      animation-delay: 320ms;
    }

    .screen.entering .seed-6 {
      animation-delay: 380ms;
    }

    @keyframes seed-arrive {
      from {
        opacity: 0;
        scale: .35;
      }

      to {
        opacity: 1;
        scale: 1;
      }
    }

    /* CLOSE ARCHIVE */

    .close-button {
      margin-top: 26px;
      padding: 12px 27px;
      border: 1px solid #dfd4c7;
      border-radius: 40px;
      background: transparent;
      color: #806f72;
      font-size: 17px;
      cursor: pointer;
      transition:
        color 200ms ease,
        border-color 200ms ease;
    }

    .close-button:hover {
      color: var(--burgundy);
      border-color: var(--burgundy);
    }

    .close-button:focus-visible {
      outline: 2px solid var(--burgundy);
      outline-offset: 4px;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      header {
        height: 64px;
        padding: 0 22px;
      }

      .brand {
        font-size: 18px;
      }

      .page {
        min-height: calc(100svh - 64px);
        padding: 24px 14px;
      }

      .fruit-button {
        width: min(90vw, 470px);
      }

      .instruction {
        font-size: 17px;
        margin-top: 12px;
      }

      .cross-stage {
        width: 100%;
        height: min(105vw, 500px);
        min-height: 320px;
      }

      .cross-section {
        width: 76%;
      }

      .seed {
        width: clamp(48px, 15vw, 75px);
        height: clamp(48px, 15vw, 75px);
      }

      .seed-1 {
        top: 4%;
        left: 5%;
      }

      .seed-2 {
        top: 4%;
        right: 5%;
      }

      .seed-3 {
        top: 40%;
        left: -2%;
      }

      .seed-4 {
        top: 40%;
        right: -2%;
      }

      .seed-5 {
        bottom: 4%;
        left: 5%;
      }

      .seed-6 {
        bottom: 4%;
        right: 5%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">The Gauri Archive</div>
  </header>

  <main class="page">

    <!-- SCREEN 1: WHOLE POMEGRANATE -->

    <section class="screen" id="opening-screen">

      <button
        class="fruit-button"
        id="open-fruit"
        aria-label="Open the pomegranate"
      >
        <img
          src="./images/pomegranate-whole.png"
          alt="A whole pomegranate"
          draggable="false"
        >
      </button>

      <p class="instruction">
        Click the pomegranate to explore.
      </p>

    </section>

    <!-- SCREEN 2: CROSS-SECTION -->

    <section class="screen" id="archive-screen" hidden>

      <div class="cross-stage">

        <div class="cross-section">
          <img
            src="./images/pomegranate-cross-section.png"
            alt="Pomegranate cross-section"
            draggable="false"
          >
        </div>

        <div class="seed seed-1">
          <img src="./images/seed1.png" alt="" draggable="false">
        </div>

        <div class="seed seed-2">
          <img src="./images/seed2.png" alt="" draggable="false">
        </div>

        <div class="seed seed-3">
          <img src="./images/seed3.png" alt="" draggable="false">
        </div>

        <div class="seed seed-4">
          <img src="./images/seed4.png" alt="" draggable="false">
        </div>

        <div class="seed seed-5">
          <img src="./images/seed5.png" alt="" draggable="false">
        </div>

        <div class="seed seed-6">
          <img src="./images/seed6.png" alt="" draggable="false">
        </div>

      </div>

      <p class="instruction">
        Choose a seed to explore.
      </p>

      <button class="close-button" id="close-archive">
        Close archive
      </button>

    </section>

  </main>

  <script>
    const openingScreen = document.getElementById("opening-screen");
    const archiveScreen = document.getElementById("archive-screen");

    const openButton = document.getElementById("open-fruit");
    const closeButton = document.getElementById("close-archive");

    let isTransitioning = false;

    function openArchive() {
      if (isTransitioning) return;

      isTransitioning = true;

      openButton.classList.add("bursting");

      window.setTimeout(() => {
        openingScreen.hidden = true;
        archiveScreen.hidden = false;

        archiveScreen.classList.remove("entering");

        // Restart the entrance animation cleanly.
        void archiveScreen.offsetWidth;

        archiveScreen.classList.add("entering");

        isTransitioning = false;
      }, 650);
    }

    function closeArchive() {
      if (isTransitioning) return;

      isTransitioning = true;

      archiveScreen.hidden = true;
      openingScreen.hidden = false;

      openButton.classList.remove("bursting");

      isTransitioning = false;
    }

    openButton.addEventListener("click", openArchive);
    closeButton.addEventListener("click", closeArchive);
  </script>

</body>
</html>
