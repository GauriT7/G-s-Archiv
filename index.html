
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>archive.gauri</title>
  <p class="tagline">collection of things I’ve made, found and thought about</p>

  <style>
    :root {
      --cream: #f8f4e9;
      --burgundy: #a0002b;
      --dark-burgundy: #69001d;
      --text: #39272b;
      --muted: #88777a;
      --border: #e1d8cb;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    /* HEADER */

    header {
      height: 80px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      color: var(--burgundy);
      font-size: 20px;
      font-weight: bold;
    }

    
/* PAGE COMPOSITION */

.page {
  min-height: calc(100vh - 80px);
  min-height: calc(100svh - 80px);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 24px 20px 40px;
}

.screen {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.screen[hidden] {
  display: none !important;
}

/* OPENING INSTRUCTION */

.instruction {
  margin: 0;
  color: var(--muted);

  font-size: 18px;
  font-style: italic;
  line-height: 1.6;
  text-align: center;
}
    
/* OPENING POMEGRANATE */

.fruit-button {
  position: relative;
  display: grid;
  place-items: center;

  width: min(76vw, 620px);
  aspect-ratio: 1;

  padding: 0;
  border: 0;
  background: transparent;

  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.fruit-button img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;

  transform-origin: 50% 55%;
  animation: sway 5s ease-in-out infinite;

  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

.fruit-button:focus-visible {
  outline: 2px solid var(--burgundy);
  outline-offset: 8px;
  border-radius: 50%;
}

    @keyframes sway {
      0%, 100% {
        transform: rotate(-2deg);
      }

      50% {
        transform: rotate(2deg);
      }
    }

    .instruction {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 19px;
      font-style: italic;
      text-align: center;
    }

    /* CROSS-SECTION STAGE */

    .cross-stage {
      position: relative;
      width: min(94vw, 850px);
      height: min(68vw, 650px);
      min-height: 390px;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .cross-section {
      position: relative;
      z-index: 1;
      width: min(66%, 530px);
      height: 100%;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .cross-section img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* CLICKABLE SEEDS */

    .seed {
      position: absolute;
      z-index: 3;
      width: clamp(66px, 10vw, 105px);
      height: clamp(66px, 10vw, 105px);

      display: grid;
      place-items: center;

      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;

      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .seed img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;

      /* The BUTTON receives the click, not the image. */
      pointer-events: none;

      transition: 
        transform 300ms ease,
        filter 300ms ease;
    }

    .seed:focus-visible {
      outline: 2px solid var(--burgundy);
      outline-offset: 3px;
    }

    .seed:active img {
      transform: scale(.9);
    }

    /* GLOW ON THE SELECTED SEED */

    .seed[aria-pressed="true"] img {
      filter:
        drop-shadow(0 0 5px rgba(160, 0, 45, 0.9))
        drop-shadow(0 0 14px rgba(160, 0, 45, 0.75))
        drop-shadow(0 0 26px rgba(160, 0, 45, 0.4));

      transform: scale(1.12);
    }

    @media (hover: hover) and (pointer: fine) {
      .seed:hover img {
        transform: scale(1.08);
      }
    }

    /* BALANCED SEED PLACEMENT */

    .seed-1 {
      top: 7%;
      left: 13%;
      transform: rotate(-18deg);
    }

    .seed-2 {
      top: 7%;
      right: 13%;
      transform: rotate(18deg);
    }

    .seed-3 {
      top: 39%;
      left: 0;
      transform: rotate(-35deg);
    }

    .seed-4 {
      top: 39%;
      right: 0;
      transform: rotate(35deg);
    }

    .seed-5 {
      bottom: 7%;
      left: 13%;
      transform: rotate(18deg);
    }

    .seed-6 {
      bottom: 7%;
      right: 13%;
      transform: rotate(-18deg);
    }

    /* SCREEN TRANSITIONS */

    .screen.entering {
      animation: screen-enter 750ms cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes screen-enter {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fruit-button.bursting img {
      animation: fruit-burst 850ms cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes fruit-burst {
      0% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }

      35% {
        transform: scale(1.12) rotate(-3deg);
        opacity: 1;
      }

      100% {
        transform: scale(.68) rotate(4deg);
        opacity: 0;
      }
    }

    .seed {
      opacity: 0;
    }

    .screen.entering .seed {
      animation: seed-arrive 800ms cubic-bezier(.22, 1, .36, 1) both;
    }

    .screen.entering .seed-1 { animation-delay: 80ms; }
    .screen.entering .seed-2 { animation-delay: 140ms; }
    .screen.entering .seed-3 { animation-delay: 200ms; }
    .screen.entering .seed-4 { animation-delay: 260ms; }
    .screen.entering .seed-5 { animation-delay: 320ms; }
    .screen.entering .seed-6 { animation-delay: 380ms; }

    @keyframes seed-arrive {
      from {
        opacity: 0;
        scale: .35;
      }

      to {
        opacity: 1;
        scale: 1;
      }
    }

    /* BOTTOM SEED INFORMATION PANEL */

    .seed-detail {
      width: min(100%, 760px);
      margin: 30px auto 0;
      padding: 34px 40px;

      background: #fcf8ef;
      border: 1px solid var(--border);
      border-top: 2px solid #d9b6b4;
      border-radius: 3px;

      animation: detail-enter 450ms cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes detail-enter {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .detail-eyebrow {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .detail-title {
      margin: 0 0 20px;
      color: var(--burgundy);
      font-size: clamp(30px, 5vw, 46px);
      font-weight: normal;
      line-height: 1.2;
    }

    .detail-description {
      margin: 0;
      font-size: 18px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    /* BUTTONS */

    .archive-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 24px;
      border: 1px solid #dfd4c7;
      border-radius: 40px;
      background: transparent;
      color: #806f72;
      font-size: 17px;
      cursor: pointer;

      transition:
        color 200ms ease,
        border-color 200ms ease,
        background 200ms ease;
    }

    .archive-button:hover {
      color: var(--burgundy);
      border-color: var(--burgundy);
    }

    .archive-button:focus-visible {
      outline: 2px solid var(--burgundy);
      outline-offset: 4px;
    }

    .close-button {
      margin-top: 26px;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      header {
        height: 64px;
        padding: 0 22px;
      }

      .brand {
        font-size: 18px;
      }

      .page {
        min-height: calc(100vh - 64px);
        min-height: calc(100svh - 64px);
        padding: 24px 14px;
      }

      .fruit-button {
        width: min(88vw, 460px);
      }

      .instruction {
        font-size: 16px;
        margin-top: 12px;
      }

      .opening-hint {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 1px;
        opacity: 0.75;
      }

      .cross-stage {
        width: 100%;
        height: min(105vw, 500px);
        min-height: 320px;
      }

      .cross-section {
        width: 76%;
      }

      .seed {
        width: clamp(48px, 15vw, 75px);
        height: clamp(48px, 15vw, 75px);
      }

      .seed-1 {
        top: 4%;
        left: 5%;
      }

      .seed-2 {
        top: 4%;
        right: 5%;
      }

      .seed-3 {
        top: 40%;
        left: 0;
      }

      .seed-4 {
        top: 40%;
        right: 0;
      }

      .seed-5 {
        bottom: 4%;
        left: 5%;
      }

      .seed-6 {
        bottom: 4%;
        right: 5%;
      }

      .seed-detail {
        margin-top: 22px;
        padding: 26px 22px;
      }

      .detail-description {
        font-size: 16px;
      }

      .detail-actions {
        flex-direction: column;
      }

      .archive-button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Custom cursor trail */
.cursor-trail {
  position: fixed;
  top: 0;
  left: 0;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #9f1239;
  pointer-events: none;
  z-index: 9999;
  opacity: 0;
  transform: translate(-50%, -50%);
  transition: opacity 180ms ease;
}

.cursor-trail.visible {
  opacity: 1;
}

.cursor-particle {
  position: fixed;
  width: 8px;
  height: 11px;
  border-radius: 50%;
  background: #9f1239;
  pointer-events: none;
  z-index: 9998;
  opacity: 0.9;
  transform: translate(-50%, -50%) rotate(25deg);
  animation: seed-fade 850ms ease-out forwards;
}

@keyframes seed-fade {
  to {
    opacity: 0;
    transform: translate(-50%, -50%) rotate(25deg) scale(0.2);
  }
}

/* Keep the effect off touchscreens and for reduced-motion preferences */

@media (prefers-reduced-motion: reduce) {
  .cursor-trail,
  .cursor-particle {
    display: none !important;
  }
}
    /* Center the archive heading and tagline */

    header {
      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">Archive.gauri</div>
  </header>

  <main class="page">

    <!-- SCREEN 1: WHOLE POMEGRANATE -->

    <section class="screen" id="opening-screen">

  <button
    class="fruit-button"
    id="open-fruit"
    aria-label="Open the pomegranate"
  >
    <img
      src="./images/pomegranate-whole.png"
      alt="A whole pomegranate"
      draggable="false"
    >
  </button>

  <p class="instruction">
    A little universe⭐️
  </p>

  <p class="opening-hint">
    Click to explore ↓
  </p>

</section>

    

    <!-- SCREEN 2: CROSS-SECTION -->

    <section class="screen" id="archive-screen" hidden>

      <div class="cross-stage">

        <div class="cross-section">
          <img
            src="./images/pomegranate-cross-section.png"
            alt="Pomegranate cross-section"
            draggable="false"
          >
        </div>

        <!-- Each seed is now a real, accessible button. -->

        <button
          class="seed seed-1"
          data-seed="1"
          aria-label="Explore seed 1"
        >
          <img src="./images/seed1.png" alt="" draggable="false">
        </button>

        <button
          class="seed seed-2"
          data-seed="2"
          aria-label="Explore seed 2"
        >
          <img src="./images/seed2.png" alt="" draggable="false">
        </button>

        <button
          class="seed seed-3"
          data-seed="3"
          aria-label="Explore seed 3"
        >
          <img src="./images/seed3.png" alt="" draggable="false">
        </button>

        <button
          class="seed seed-4"
          data-seed="4"
          aria-label="Explore seed 4"
        >
          <img src="./images/seed4.png" alt="" draggable="false">
        </button>

        <button
          class="seed seed-5"
          data-seed="5"
          aria-label="Explore seed 5"
        >
          <img src="./images/seed5.png" alt="" draggable="false">
        </button>

        <button
          class="seed seed-6"
          data-seed="6"
          aria-label="Explore seed 6"
        >
          <img src="./images/seed6.png" alt="" draggable="false">
        </button>

      </div>

      <p class="instruction" id="seed-instruction">
        Choose a seed to explore.
      </p>

      <!-- BOTTOM INFORMATION PANEL -->

      <section
        class="seed-detail"
        id="seed-detail"
        aria-live="polite"
        aria-atomic="true"
        hidden
      >
        <p class="detail-eyebrow" id="detail-eyebrow">
          FROM THE ARCHIVE
        </p>

        <h2 class="detail-title" id="detail-title">
          Seed 1
        </h2>

        <p class="detail-description" id="detail-description"></p>

        <div class="detail-actions">

          <button
            class="archive-button"
            id="back-to-seeds"
          >
            ← Back to the seeds
          </button>

          <button
            class="archive-button"
            id="close-detail"
          >
            Close entry
          </button>

        </div>
      </section>

      <button class="archive-button close-button" id="close-archive">
        Close archive
      </button>

    </section>

  </main>

  <script>
    const openingScreen = document.getElementById("opening-screen");
    const archiveScreen = document.getElementById("archive-screen");

    const openButton = document.getElementById("open-fruit");
    const closeButton = document.getElementById("close-archive");

    const seedButtons = document.querySelectorAll(".seed");

    const seedInstruction = document.getElementById("seed-instruction");
    const seedDetail = document.getElementById("seed-detail");

    const detailEyebrow = document.getElementById("detail-eyebrow");
    const detailTitle = document.getElementById("detail-title");
    const detailDescription = document.getElementById("detail-description");

    const backButton = document.getElementById("back-to-seeds");
    const closeDetailButton = document.getElementById("close-detail");

    let isTransitioning = false;
    let selectedSeed = null;
    let transitionTimer = null;

    /*
      Add your actual archive entries here.

      The filenames above are already correct.
      Only change the text inside these descriptions.
    */

    const seedEntries = {
      1: {
        title: "Seed 1",
        description: "Your first archive entry goes here."
      },

      2: {
        title: "Seed 2",
        description: "Your second archive entry goes here."
      },

      3: {
        title: "Seed 3",
        description: "Your third archive entry goes here."
      },

      4: {
        title: "Seed 4",
        description: "Your fourth archive entry goes here."
      },

      5: {
        title: "Seed 5",
        description: "Your fifth archive entry goes here."
      },

      6: {
        title: "Seed 6",
        description: "Your sixth archive entry goes here."
      }
    };

    /* OPEN THE POMEGRANATE */

    
function openArchive() {
  if (isTransitioning) return;

  isTransitioning = true;

  openButton.classList.add("bursting");

  transitionTimer = window.setTimeout(() => {
    openingScreen.hidden = true;
    archiveScreen.hidden = false;

    archiveScreen.classList.remove("entering");

    void archiveScreen.offsetWidth;

    archiveScreen.classList.add("entering");

    isTransitioning = false;
    transitionTimer = null;
  }, 850);
}

    /* SHOW THE SELECTED SEED */

    function openSeed(seedNumber) {
      const entry = seedEntries[seedNumber];

      if (!entry) return;

      selectedSeed = seedNumber;

      detailEyebrow.textContent = "FROM THE ARCHIVE";
      detailTitle.textContent = entry.title;
      detailDescription.textContent = entry.description;

      seedDetail.hidden = false;
      seedInstruction.hidden = true;

      seedDetail.classList.remove("entering");

      // Restart the detail animation.
      void seedDetail.offsetWidth;

      seedDetail.classList.add("entering");

      // Highlight the currently selected seed.
      seedButtons.forEach(button => {
        const isSelected =
          Number(button.dataset.seed) === seedNumber;

        button.setAttribute("aria-pressed", String(isSelected));
      });

      // Scroll to the opened entry.
  
      seedDetail.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
      
    }

    /* CLOSE THE DETAIL PANEL */

    function closeDetail() {
      seedDetail.hidden = true;
      seedInstruction.hidden = false;

      selectedSeed = null;

      seedButtons.forEach(button => {
        button.setAttribute("aria-pressed", "false");
      });
    }

    /* RETURN TO THE OPENING SCREEN */

    function closeArchive() {
      if (isTransitioning) return;

      if (transitionTimer !== null) {
        window.clearTimeout(transitionTimer);
        transitionTimer = null;
      }

      closeDetail();

      archiveScreen.hidden = true;
      openingScreen.hidden = false;

      openButton.classList.remove("bursting");

      archiveScreen.classList.remove("entering");
    }

    /* CLICK EVENTS */

    openButton.addEventListener("click", openArchive);

    closeButton.addEventListener("click", closeArchive);

    backButton.addEventListener("click", closeDetail);

    closeDetailButton.addEventListener("click", closeDetail);

    seedButtons.forEach(button => {
      button.addEventListener("click", () => {
        const seedNumber = Number(button.dataset.seed);
        openSeed(seedNumber);
      });
    });

    /* KEYBOARD SUPPORT */

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        if (!seedDetail.hidden) {
          closeDetail();
        } else if (!archiveScreen.hidden) {
          closeArchive();
        }
      }
    });

    // Subtle pomegranate-seed cursor trail
if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const trail = document.createElement("div");
  trail.className = "cursor-trail";
  document.body.appendChild(trail);

  let lastParticleTime = 0;

  window.addEventListener("pointermove", (event) => {
  if (event.pointerType !== "mouse") return;
    trail.style.left = `${event.clientX}px`;
    trail.style.top = `${event.clientY}px`;
    trail.classList.add("visible");

    const now = performance.now();

    // Leave a small particle occasionally, not on every mouse movement
    if (now - lastParticleTime > 35) {
      lastParticleTime = now;

      const particle = document.createElement("div");
      particle.className = "cursor-particle";
      particle.style.left = `${event.clientX}px`;
      particle.style.top = `${event.clientY}px`;

      document.body.appendChild(particle);
      particle.addEventListener("animationend", () => particle.remove(), {
        once: true
      });
    }
  });

  window.addEventListener("mouseleave", () => {
    trail.classList.remove("visible");
  });

  window.addEventListener("mouseenter", () => {
    trail.classList.add("visible");
  });
}
  </script>

</body>
</html>
