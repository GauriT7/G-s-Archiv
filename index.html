
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Gauri Archive</title>

<style>
:root {
  --paper: #f8f4e9;
  --cream: #fffaf0;
  --ink: #30221f;
  --muted: #88766d;
  --red: #a5002c;
  --line: #dfd4c7;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  background: var(--paper);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
}

button {
  font: inherit;
  color: inherit;
}

.site-header {
  height: 80px;
  padding: 0 clamp(22px, 6vw, 90px);
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--line);
}

.site-header a {
  color: var(--red);
  font-size: 19px;
  font-weight: bold;
  text-decoration: none;
}

/* -------------------------
   FIRST SCREEN
------------------------- */

.archive {
  min-height: calc(100svh - 80px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 35px 20px 55px;
}

.archive-inner {
  width: 100%;
  max-width: 1050px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.fruit-stage {
  position: relative;
  width: min(100%, 620px);
  height: clamp(350px, 57vw, 570px);
  display: grid;
  place-items: center;
  isolation: isolate;
}

/* The illustrations overlap in the same position. */

.fruit {
  position: absolute;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* Whole pomegranate: visible immediately. */

.whole-fruit {
  width: min(76%, 410px);
  height: 90%;
  opacity: 1;
  transform-origin: 50% 56%;
  animation: gentle-sway 5s ease-in-out infinite;
  transition:
    opacity 900ms ease,
    transform 1100ms cubic-bezier(.2,.8,.2,1);
  z-index: 2;
}

/* Cross-section: hidden until the transition begins. */

.cross-section {
  width: min(78%, 440px);
  height: 100%;
  opacity: 0;
  transform: scale(.78) rotate(-5deg);
  transition:
    opacity 1000ms ease,
    transform 1200ms cubic-bezier(.2,.8,.2,1);
  z-index: 1;
}

.archive-inner.opened .whole-fruit {
  opacity: 0;
  transform: scale(.68) rotate(12deg);
  animation: none;
}

.archive-inner.opened .cross-section {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

/* -------------------------
   SEED BURST
------------------------- */

.seed-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
}

.flying-seed {
  position: absolute;
  left: 50%;
  top: 50%;
  width: clamp(34px, 6vw, 58px);
  height: clamp(34px, 6vw, 58px);
  object-fit: contain;
  opacity: 0;
  transform: translate(-50%, -50%) scale(.2);
  transition:
    transform 1500ms cubic-bezier(.16,1,.3,1),
    opacity 700ms ease;
  pointer-events: none;
}

.opened .flying-seed {
  opacity: 1;
  transform:
    translate(
      calc(-50% + var(--x)),
      calc(-50% + var(--y))
    )
    rotate(var(--rotation))
    scale(1);
}

.opened .flying-seed:nth-child(1) {
  transition-delay: 100ms;
}

.opened .flying-seed:nth-child(2) {
  transition-delay: 180ms;
}

.opened .flying-seed:nth-child(3) {
  transition-delay: 260ms;
}

.opened .flying-seed:nth-child(4) {
  transition-delay: 340ms;
}

.opened .flying-seed:nth-child(5) {
  transition-delay: 420ms;
}

.opened .flying-seed:nth-child(6) {
  transition-delay: 500ms;
}

/* No circles around the seeds. */

.seed-button {
  position: absolute;
  left: 50%;
  top: 50%;
  width: clamp(40px, 6vw, 60px);
  height: clamp(40px, 6vw, 60px);
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 5;
  transition:
    left 1200ms cubic-bezier(.16,1,.3,1),
    top 1200ms cubic-bezier(.16,1,.3,1),
    opacity 500ms ease;
}

.seed-button img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform 300ms ease;
}

.seed-button:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 5px;
  border-radius: 50%;
}

@media (hover: hover) and (pointer: fine) {
  .seed-button:hover img {
    transform: scale(1.2) rotate(-8deg);
  }
}

.opened .seed-button {
  opacity: 1;
  pointer-events: auto;
}

.opened .seed-button:nth-child(1) {
  left: 22%;
  top: 28%;
}

.opened .seed-button:nth-child(2) {
  left: 77%;
  top: 30%;
}

.opened .seed-button:nth-child(3) {
  left: 15%;
  top: 52%;
}

.opened .seed-button:nth-child(4) {
  left: 84%;
  top: 55%;
}

.opened .seed-button:nth-child(5) {
  left: 30%;
  top: 79%;
}

.opened .seed-button:nth-child(6) {
  left: 72%;
  top: 81%;
}

/* -------------------------
   TEXT & CONTROLS
------------------------- */

.instruction {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: clamp(15px, 1.6vw, 18px);
  font-style: italic;
}

.archive-controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 26px;
}

.archive-button {
  padding: 11px 20px;
  border: 1px solid var(--line);
  border-radius: 30px;
  background: var(--cream);
  color: var(--muted);
  cursor: pointer;
  transition:
    color 250ms ease,
    border-color 250ms ease,
    background 250ms ease;
}

.archive-button:hover {
  color: var(--red);
  border-color: var(--red);
}

.archive-button:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 4px;
}

#backButton {
  display: none;
}

.opened #backButton {
  display: inline-block;
}

/* -------------------------
   RESPONSIVE
------------------------- */

@media (max-width: 600px) {
  .site-header {
    height: 64px;
  }

  .archive {
    min-height: calc(100svh - 64px);
    padding: 20px 12px 35px;
  }

  .fruit-stage {
    height: min(115vw, 460px);
  }

  .whole-fruit {
    width: 84%;
  }

  .cross-section {
    width: 88%;
  }

  .seed-button {
    width: 42px;
    height: 42px;
  }

  .archive-controls {
    margin-top: 22px;
  }
}

/* Respect reduced-motion preferences. */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

@keyframes gentle-sway {
  0%, 100% {
    transform: rotate(-2deg) translateY(0);
  }

  50% {
    transform: rotate(2deg) translateY(-7px);
  }
}

/* -------------------------
   POMEGRANATE CURSOR
------------------------- */

@media (hover: hover) and (pointer: fine) {
  body {
    cursor: url("images/seed1.png") 16 16, auto;
  }

  a,
  button {
    cursor: url("images/seed1.png") 16 16, pointer;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <a href="#" id="homeLink">The Gauri Archive</a>
</header>

<main>
  <section class="archive" id="archive">

    <div class="archive-inner" id="archiveInner">

      <div
        class="fruit-stage"
        id="fruitStage"
        aria-label="Pomegranate illustration"
      >

        <!-- First screen illustration -->

        <img
          class="fruit whole-fruit"
          id="wholeFruit"
          src="images/pomegranate-whole.png"
          alt="Whole pomegranate"
          draggable="false"
        >

        <!-- Cross-section illustration -->

        <img
          class="fruit cross-section"
          id="crossSection"
          src="images/pomegranate-cross-section.png"
          alt="Pomegranate cross-section"
          draggable="false"
        >

        <!-- Seeds that burst outward -->

        <div class="seed-layer" aria-hidden="true">

          <img class="flying-seed"
               src="images/seed1.png"
               style="--x:-120px;--y:-150px;--rotation:-25deg"
               alt="">

          <img class="flying-seed"
               src="images/seed2.png"
               style="--x:130px;--y:-145px;--rotation:35deg"
               alt="">

          <img class="flying-seed"
               src="images/seed3.png"
               style="--x:-180px;--y:0px;--rotation:20deg"
               alt="">

          <img class="flying-seed"
               src="images/seed4.png"
               style="--x:185px;--y:10px;--rotation:-35deg"
               alt="">

          <img class="flying-seed"
               src="images/seed5.png"
               style="--x:-115px;--y:150px;--rotation:45deg"
               alt="">

          <img class="flying-seed"
               src="images/seed6.png"
               style="--x:125px;--y:150px;--rotation:-20deg"
               alt="">

        </div>

        <!-- Clickable seeds -->

        <button class="seed-button"
                type="button"
                aria-label="Explore seed 1">
          <img src="images/seed1.png" alt="">
        </button>

        <button class="seed-button"
                type="button"
                aria-label="Explore seed 2">
          <img src="images/seed2.png" alt="">
        </button>

        <button class="seed-button"
                type="button"
                aria-label="Explore seed 3">
          <img src="images/seed3.png" alt="">
        </button>

        <button class="seed-button"
                type="button"
                aria-label="Explore seed 4">
          <img src="images/seed4.png" alt="">
        </button>

        <button class="seed-button"
                type="button"
                aria-label="Explore seed 5">
          <img src="images/seed5.png" alt="">
        </button>

        <button class="seed-button"
                type="button"
                aria-label="Explore seed 6">
          <img src="images/seed6.png" alt="">
        </button>

      </div>

      <p class="instruction" id="instruction">
        Click the pomegranate to explore.
      </p>

      <div class="archive-controls">

        <button
          class="archive-button"
          id="backButton"
          type="button"
        >
          Close archive
        </button>

      </div>

    </div>

  </section>
</main>

<script>
(() => {
  const archiveInner = document.getElementById("archiveInner");
  const fruitStage = document.getElementById("fruitStage");
  const wholeFruit = document.getElementById("wholeFruit");
  const crossSection = document.getElementById("crossSection");
  const instruction = document.getElementById("instruction");
  const backButton = document.getElementById("backButton");
  const homeLink = document.getElementById("homeLink");

  let isOpen = false;

  function openArchive() {
    if (isOpen) return;

    isOpen = true;

    archiveInner.classList.add("opened");

    instruction.textContent = "Choose a seed to explore.";

    // Move keyboard focus away from the disappearing fruit.
    backButton.focus({ preventScroll: true });
  }

  function closeArchive() {
    if (!isOpen) return;

    isOpen = false;

    archiveInner.classList.remove("opened");

    instruction.textContent =
      "Click the pomegranate to explore.";

    wholeFruit.focus?.({ preventScroll: true });
  }

  // Clicking the whole fruit opens the cross-section.
  wholeFruit.addEventListener("click", openArchive);
  fruitStage.addEventListener("click", (event) => {
    if (event.target === fruitStage ||
        event.target === crossSection) {
      if (!isOpen) openArchive();
    }
  });

  // Clicking Close archive returns to the first screen.
  backButton.addEventListener("click", closeArchive);

  // Clicking the archive name returns home.
  homeLink.addEventListener("click", (event) => {
    event.preventDefault();

    if (isOpen) {
      closeArchive();
    } else {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });

  // Make the six seeds interactive without inventing
  // new content or adding extra sections.
  document.querySelectorAll(".seed-button").forEach((button, index) => {
    button.addEventListener("click", () => {
      instruction.textContent =
        `Seed ${index + 1} selected.`;
    });
  });

  // Open the archive with Enter or Space when the
  // whole pomegranate is focused.
  wholeFruit.setAttribute("tabindex", "0");
  wholeFruit.setAttribute("role", "button");
  wholeFruit.setAttribute("aria-label", "Open the archive");

  wholeFruit.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openArchive();
    }
  });

  // Return to the whole pomegranate with Escape.
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && isOpen) {
      closeArchive();
    }
  });

  // If an image fails to load, identify the exact file.
  document.querySelectorAll("img").forEach((image) => {
    image.addEventListener("error", () => {
      console.error("Could not load image:", image.getAttribute("src"));
    });
  });
})();
</script>

</body>
</html>
