<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Web of Things</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- OPENING -->
        <section class="opening">

            <p class="eyebrow">THE CONCOCTION · 01</p>

            <h1>The Web<br>of Things</h1>

            <p class="intro">
                Nothing really exists alone.
            </p>

        </section>


        <!-- THE THREAD -->
        <section class="thread-intro">

            <p class="small-text">
                Pull one thread.
            </p>

            <div class="web">

                <div class="thread-node">WAR</div>

                <div class="thread-line"></div>

                <div class="thread-node">ECONOMICS</div>

                <div class="thread-line"></div>

                <div class="thread-node">FOOD</div>

                <div class="thread-line"></div>

                <div class="thread-node">FASHION</div>

                <div class="thread-line"></div>

                <div class="thread-node">ART</div>

                <div class="thread-line"></div>

                <div class="thread-node">MEDIA</div>

                <div class="thread-line"></div>

                <div class="thread-node">PEOPLE</div>

            </div>

        </section>


        <!-- FIRST IDEA -->
        <section class="statement">

            <p>
                A war does not stay on the battlefield.
            </p>

            <p>
                It enters kitchens.<br>
                It enters wardrobes.<br>
                It enters paintings.<br>
                It enters economies.<br>
                It enters families.
            </p>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
